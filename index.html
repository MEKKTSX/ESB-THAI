// ⌨️ TYPING CHALLENGE FEATURE (Anki-like Smart Diff Checking)
// ==========================================
window.ESB_Features = window.ESB_Features || {};

window.ESB_Features.TypingChallengeView = ({ queue, onClose, onSaveSRS, settings }) => {
    const { useState, useEffect, useRef } = React;
    const { XIcon, Volume2Icon, CheckCircleIcon, BookIcon, SlidersIcon } = window.Icons || {};

    const [currentIndex, setCurrentIndex] = useState(0);
    const [userInput, setUserInput] = useState("");
    const [isSubmitted, setIsSubmitted] = useState(false);
    const [showHintCount, setShowHintCount] = useState(0);
    const inputRef = useRef(null);

    const currentCard = queue[currentIndex];

    // จัดเตรียมข้อความและตัวอักษร
    const targetText = currentCard?.en || "";
    const promptText = currentCard?.th || "";

    // ปรับปรุงการสลับภาษาในการพิมพ์ (สลับได้ผ่าน Settings)
    const isThaiPrompt = true; // แปลไทย -> พิมพ์อังกฤษเป็นมาตรฐานที่ดีที่สุดสำหรับคนไทย

    // เล่นเสียงอ่านอัตโนมัติเมื่อกดตรวจคำตอบหรือเฉลย
    useEffect(() => {
        if (settings?.autoPlay && isSubmitted && currentCard && window.Utils?.speak) {
            const playSpeed = settings?.speed || 1.0;
            window.Utils.speak(targetText, 'en-US', playSpeed);
        }
    }, [currentIndex, isSubmitted, currentCard, settings, targetText]);

    // โฟกัสกล่องรับค่าอัตโนมัติเมื่อเปลี่ยนข้อ
    useEffect(() => {
        if (inputRef.current) {
            inputRef.current.focus();
        }
        setUserInput("");
        setIsSubmitted(false);
        setShowHintCount(0);
    }, [currentIndex]);

    // คีย์ลัดนำทางและให้คะแนนตามมาตรฐาน Anki (1-4 ให้คะแนนเมื่อส่งคำตอบแล้ว)
    useEffect(() => {
        const handleGlobalKeyDown = (e) => {
            if (!isSubmitted) return;
            
            // คีย์ 1-4 สำหรับประเมินผล SRS
            if (e.key === '1') {
                e.preventDefault();
                handleRate('again');
            } else if (e.key === '2') {
                e.preventDefault();
                handleRate('hard');
            } else if (e.key === '3') {
                e.preventDefault();
                handleRate('good');
            } else if (e.key === '4') {
                e.preventDefault();
                handleRate('easy');
            } 
            // Enter หรือ Spacebar เมื่อส่งคำตอบแล้ว: ถ้าถูก 100% ให้ Easy ถ้าผิดให้ Again
            else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (isExactlyCorrect) {
                    handleRate('easy');
                } else {
                    handleRate('again');
                }
            }
        };
        window.addEventListener('keydown', handleGlobalKeyDown);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown);
    }, [isSubmitted, isExactlyCorrect, currentIndex, queue]);

    if (!currentCard) {
        return (
            <div className="fixed inset-0 z-50 bg-[#0B1121] flex flex-col items-center justify-center animate-fade-in p-6">
                <div className="text-brand-yellow mb-6 text-6xl animate-bounce">🎉</div>
                <h2 className="text-3xl font-extrabold text-white mb-2">Challenge Complete!</h2>
                <p className="text-slate-400 text-sm mb-8 text-center max-w-xs">You've successfully typed and reviewed all selected cards.</p>
                <button onClick={onClose} className="px-8 py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-navy-900 font-bold rounded-2xl shadow-lg hover:shadow-yellow-500/20 active:scale-95 transition-all uppercase text-sm tracking-wider">
                    Go Back To Dashboard
                </button>
            </div>
        );
    }

    // ฟังก์ชันทำความสะอาดข้อความเพื่อเปรียบเทียบความถูกต้องโดยไม่ซีเรียสเรื่องตัวเล็กใหญ่หรือเครื่องหมายวรรคตอน
    const cleanText = (str) => {
        return str.toLowerCase()
                  .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"")
                  .replace(/\s{2,}/g," ")
                  .trim();
    };

    // คำนวณความถูกต้องแบบคร่าวๆ เพื่อตัดสินระบบ Easy/Again
    const userClean = cleanText(userInput);
    const targetClean = cleanText(targetText);
    const isExactlyCorrect = userClean === targetClean;

    // ระบบเปรียบเทียบคำสะกดแบบเรียลไทม์ (Spelling Realtime Diff Engine)
    const renderDiff = () => {
        const target = targetText;
        const user = userInput;
        const result = [];
        const maxLen = Math.max(target.length, user.length);
        
        // แปลงเครื่องหมายคำพูดหยักหรือตรงให้เป็นมาตรฐานเดียวกัน
        const norm = (c) => (c === '’' || c === '`' || c === '‘') ? "'" : c;

        for (let i = 0; i < maxLen; i++) {
            const tChar = target[i];
            const uChar = user[i];

            if (uChar === undefined) {
                // ตัวอักษรที่ยังไม่ได้พิมพ์ (แสดงสีเทาจางตามความคลาสสิก)
                result.push(
                    <span key={i} className="text-slate-600 font-mono tracking-wider">
                        {tChar === ' ' ? '\u00A0' : tChar}
                    </span>
                );
            } else if (tChar !== undefined) {
                const isMatch = norm(tChar).toLowerCase() === norm(uChar).toLowerCase();
                if (isMatch) {
                    // พิมพ์ถูก: สีเขียวมรกตเรืองแสงพรีเมียม
                    result.push(
                        <span key={i} className="text-emerald-400 font-mono font-bold tracking-wider drop-shadow-[0_0_8px_rgba(52,211,153,0.35)]">
                            {uChar === ' ' ? '\u00A0' : uChar}
                        </span>
                    );
                } else {
                    // พิมพ์ผิด: พื้นหลังสีแดงอ่อนขีดเส้นใต้สีแดงเด่นชัด
                    result.push(
                        <span key={i} className="bg-rose-500/20 text-rose-400 font-mono font-bold tracking-wider border-b-2 border-rose-500 px-[0.5px]" title={`Expected: ${tChar === ' ' ? 'Space' : tChar}`}>
                            {uChar === ' ' ? '\u00A0' : uChar}
                        </span>
                    );
                }
            } else {
                // พิมพ์เกิน: แสดงตัวอักษรสีแดงจางๆ แบบเส้นประ
                result.push(
                    <span key={i} className="bg-rose-500/10 text-rose-300 font-mono font-bold tracking-wider border-b-2 border-dashed border-rose-400 px-[0.5px]">
                        {uChar === ' ' ? '\u00A0' : uChar}
                    </span>
                );
            }
        }
        return (
            <div className="flex flex-wrap items-center justify-center gap-y-1.5 text-base md:text-lg tracking-wider font-mono select-none break-all max-w-full">
                {result}
            </div>
        );
    };

    // ปุ่มช่วยเหลือ: ค่อยๆ บอกตัวอักษรถัดไป
    const handleGetHint = () => {
        if (showHintCount < targetText.length) {
            const nextCount = showHintCount + 3; // เผยทีละ 3 ตัวอักษร
            setShowHintCount(nextCount);
            setUserInput(targetText.substring(0, nextCount));
            if (inputRef.current) inputRef.current.focus();
        }
    };

    const handleCheckAnswer = () => {
        setIsSubmitted(true);
    };

    const handleRate = (rating) => {
        if (onSaveSRS) {
            onSaveSRS(currentCard.uniqueId, rating);
        }
        if (currentIndex < queue.length - 1) {
            setCurrentIndex(prev => prev + 1);
        } else {
            onClose(); // จบเซสชัน
        }
    };

    return (
        <div className="fixed inset-0 z-[100] bg-gradient-to-br from-[#0B0F19] via-[#111827] to-[#1F1A3A] flex flex-col h-full w-full overflow-hidden animate-fade-in text-slate-200">
            {/* Header */}
            <div className="px-6 py-5 flex items-center justify-between z-10 bg-navy-900/40 backdrop-blur-md border-b border-white/[0.06] shrink-0">
                <button onClick={onClose} className="p-2 -ml-2 text-slate-400 hover:text-white bg-white/5 rounded-full hover:scale-105 active:scale-95 transition-all">
                    {XIcon ? <XIcon size={20} /> : '✕'}
                </button>
                <div className="flex flex-col items-center">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.25em]">Session Review</span>
                    <span className="text-sm font-bold text-white tracking-wider">Typing Challenge</span>
                </div>
                <div className="w-8"></div>
            </div>

            {/* Top Progress Bar */}
            <div className="px-6 mt-3 shrink-0">
                <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">
                    <span>PROGRESS</span>
                    <span className="text-brand-yellow font-bold">{currentIndex + 1} / {queue.length}</span>
                </div>
                <div className="w-full h-2 bg-navy-950 rounded-full overflow-hidden border border-white/5 shadow-inner">
                    <div className="h-full bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-500 transition-all duration-300 rounded-full" style={{ width: `${((currentIndex + 1) / queue.length) * 100}%` }}></div>
                </div>
            </div>

            {/* Main Area */}
            <div className="flex-1 flex flex-col px-6 py-4 overflow-hidden">
                <div className="backdrop-blur-xl bg-white/[0.03] border border-white/[0.08] flex-1 rounded-[2.5rem] shadow-2xl flex flex-col relative overflow-hidden">
                    
                    {/* Glowing effect inside card */}
                    <div className="absolute -top-24 -right-24 w-60 h-60 bg-yellow-500/5 blur-[80px] rounded-full pointer-events-none"></div>
                    <div className="absolute -bottom-24 -left-24 w-60 h-60 bg-blue-500/5 blur-[80px] rounded-full pointer-events-none"></div>

                    {/* Card Content */}
                    <div className="flex-1 overflow-y-auto flex flex-col items-center justify-center p-6 text-center space-y-8" style={{ scrollbarWidth: 'none' }}>
                        {/* Thai Prompt */}
                        <div className="space-y-2">
                            <span className="text-[10px] font-extrabold tracking-widest text-brand-yellow/80 border border-brand-yellow/30 bg-brand-yellow/10 px-3 py-1.5 rounded-full uppercase">Translate to English</span>
                            <h3 className="text-2xl md:text-3xl font-bold text-white leading-snug pt-3 px-2">{promptText}</h3>
                        </div>

                        {/* Visual Diff Output */}
                        {userInput.length > 0 && (
                            <div className="w-full p-6 bg-navy-950/60 rounded-3xl border border-white/5 shadow-inner">
                                {renderDiff()}
                            </div>
                        )}

                        {/* Target Display (When Submitted) */}
                        {isSubmitted && (
                            <div className="space-y-4 animate-fade-in w-full max-w-md">
                                <div className="w-12 h-1 bg-navy-800 rounded-full mx-auto"></div>
                                <div className="flex flex-col items-center space-y-2">
                                    <span className="text-[10px] font-bold text-slate-500 tracking-wider uppercase">Correct Answer</span>
                                    <div className="flex items-center gap-2">
                                        <p className="text-xl md:text-2xl font-bold text-emerald-400">{targetText}</p>
                                        <button 
                                            onClick={() => window.Utils?.speak && window.Utils.speak(targetText, 'en-US', settings?.speed || 1.0)} 
                                            className="p-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-full transition-colors active:scale-90"
                                        >

                                    <button

                                        <span className="text-[9px] opacity-60 mt-0.5">4d</span>
                                    </button>
                                    <button

                                    >
                                        <span className="font-extrabold text-sm">Easy</span>
                                        <span className="text-[9px] opacity-60 mt-0.5">7d</span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
};

// 🎙️ AI VOICE TALK FEATURE (Realtime Interactive Speech Dialogue)

window.ESB_Features = window.ESB_Features || {};

window.ESB_Features.AIVoiceTalkView = ({ onClose, settings }) => {
    const { useState, useEffect, useRef } = React;
    const { XIcon, Volume2Icon, CheckCircleIcon } = window.Icons || {};

    const [activeScenario, setActiveScenario] = useState(null); // 'cafe', 'directions', 'hobbies'
    const [chatHistory, setChatHistory] = useState([]);
    const [currentStep, setCurrentStep] = useState(0);
    const [isListening, setIsListening] = useState(false);
    const [transcript, setTranscript] = useState("");
    const [suggestions, setSuggestions] = useState([]);
    const [isThinking, setIsThinking] = useState(false);
    const [recognitionSupported, setRecognitionSupported] = useState(true);
    const [showResults, setShowResults] = useState(false);

    const messagesEndRef = useRef(null);
    const recognitionRef = useRef(null);

    // รายชื่อหัวข้อบทสนทนาและโครงสร้างประโยคโต้ตอบออฟไลน์
    const SCENARIOS = {
        cafe: {
            title: "At the Star Café",
            subtitle: "ฝึกสั่งอาหารและเครื่องดื่มในร้านกาแฟ",
            icon: "☕",
            steps: [
                {
                    aiPrompt: "Welcome to Star Café! What would you like to order today?",
                    userSuggestions: [
                        "I would like a cup of hot coffee and a chocolate cake, please.",
                        "Can I have an iced green tea and a warm croissant, please?",
                        "Hello! Do you have any fresh juices?"
                    ],
                    // ตัวประมวลคำตอบของผู้เรียน
                    processReply: (userText) => {
                        const clean = userText.toLowerCase();
                        if (clean.includes("coffee") || clean.includes("cake")) {
                            return {
                                nextPrompt: "Excellent choice! A coffee and a chocolate cake. Would you like a hot coffee or an iced coffee? And what size?",
                                suggestions: ["Hot coffee, large size, please.", "Iced coffee, medium size, please."]
                            };
                        } else if (clean.includes("tea") || clean.includes("croissant")) {
                            return {
                                nextPrompt: "Great! A green tea and a croissant. Would you like the croissant warmed up?",
                                suggestions: ["Yes, please warm it up.", "No, thank you, cold is fine."]
                            };
                        } else {
                            return {
                                nextPrompt: "Yes, we have fresh orange juice and sweet apple juice! Which one do you prefer?",
                                suggestions: ["I prefer orange juice, please.", "I will take the apple juice, please."]
                            };
                        }
                    }
                },
                {
                    // Step 1 response processing
                    processReply: (userText) => {
                        const clean = userText.toLowerCase();
                        if (clean.includes("hot") || clean.includes("iced")) {
                            return {
                                nextPrompt: "Perfect! You got it. That will be six dollars total. Will that be cash or card?",
                                suggestions: ["I will pay with cash.", "Here is my credit card."]
                            };
                        } else if (clean.includes("warm") || clean.includes("yes") || clean.includes("please")) {
                            return {
                                nextPrompt: "Excellent! I will warm it up for you. That will be five dollars. Cash or credit card?",
                                suggestions: ["I will pay with cash.", "I'll pay by card, please."]
                            };
                        } else {
                            return {
                                nextPrompt: "Great choice! Fresh juice is very healthy. That will be four dollars. Cash or credit card?",
                                suggestions: ["Here is cash.", "By credit card, please."]
                            };
                        }
                    }
                },
                {
                    // Step 2 final processing
                    processReply: (userText) => {
                        return {
                            nextPrompt: "Perfect, transaction complete! You can take a seat, and I will bring it to you shortly. Enjoy your day!",
                            suggestions: [],
                            isFinal: true
                        };
                    }
                }
            ]
        },
        directions: {
            title: "Asking for Directions",
            subtitle: "ฝึกถามทางไปยังจุดหมายต่าง ๆ ในต่างแดน",
            icon: "🗺️",
            steps: [
                {
                    aiPrompt: "Excuse me, are you lost? Can I help you find something in this area?",
                    userSuggestions: [
                        "Yes, please! I am looking for the nearest subway station.",
                        "Yes, could you tell me how to get to the public library?",
                        "Oh, hi! Is there a good restaurant nearby?"
                    ],
                    processReply: (userText) => {
                        const clean = userText.toLowerCase();
                        if (clean.includes("subway") || clean.includes("station")) {
                            return {
                                nextPrompt: "Oh, the subway is very close! Walk straight for two blocks, then turn left. You will see it on your right. Is that clear?",
                                suggestions: ["Yes, I understand. Walk straight and turn left.", "Can you please repeat that?"]
                            };
                        } else if (clean.includes("library")) {
                            return {
                                nextPrompt: "The library is about a ten-minute walk from here. Walk past the bank, then turn right. Do you know where the bank is?",
                                suggestions: ["Yes, I see the bank down the street.", "No, where is the bank exactly?"]
                            };
                        } else {
                            return {
                                nextPrompt: "There is an amazing Thai restaurant just across the street! It is very delicious. Do you like spicy food?",
                                suggestions: ["Yes, I love spicy Thai food!", "No, I prefer mild food, thank you."]
                            };
                        }
                    }
                },
                {
                    processReply: (userText) => {
                        const clean = userText.toLowerCase();
                        if (clean.includes("repeat") || clean.includes("where")) {
                            return {
                                nextPrompt: "No problem! Walk straight down this road, turn left at the corner, and the station is right next to the big supermarket. You cannot miss it!",
                                suggestions: ["Thank you so much for your help!", "I got it now! Have a nice day."]
                            };
                        } else {
                            return {
                                nextPrompt: "Perfect! You are on the right track. It is very simple to find. Have a safe trip!",
                                suggestions: ["Thank you! Have a great day.", "Thanks! Appreciate your kindness."]
                            };
                        }
                    }
                },
                {
                    processReply: (userText) => {
                        return {
                            nextPrompt: "You are very welcome! Helping travelers always makes my day. Enjoy your journey!",
                            suggestions: [],
                            isFinal: true
                        };
                    }
                }
            ]
        },
        hobbies: {
            title: "Hobbies & Daily Life",
            subtitle: "แลกเปลี่ยนพูดคุยเรื่องกิจกรรมยามว่าง",
            icon: "🎾",
            steps: [
                {
                    aiPrompt: "Hello! It is so nice to meet you. What do you usually like to do in your free time?",
                    userSuggestions: [
                        "I really enjoy reading romantic books and playing tennis.",
                        "I love cooking delicious food for my family and watching movies.",
                        "I prefer traveling to new places and taking beautiful photos."
                    ],
                    processReply: (userText) => {
                        const clean = userText.toLowerCase();
                        if (clean.includes("reading") || clean.includes("books") || clean.includes("tennis")) {
                            return {
                                nextPrompt: "Wow, books and tennis! A perfect balance of mind and body. Who is your favorite writer? Or do you play tennis often?",
                                suggestions: ["My favorite writer is William Shakespeare.", "I play tennis with my friends every weekend."]
                            };
                        } else if (clean.includes("cooking") || clean.includes("movies")) {
                            return {
                                nextPrompt: "Cooking and movies sound lovely! What is your favorite dish to cook? Or what kind of movies do you enjoy?",
                                suggestions: ["I love to cook Italian pasta.", "I really enjoy watching adventure movies."]
                            };
                        } else {
                            return {
                                nextPrompt: "Traveling and photography! That is wonderful. What was the most beautiful place you visited recently?",
                                suggestions: ["I visited a beautiful mountain peak last month.", "I traveled to a quiet beach near Bangkok."]
                            };
                        }
                    }
                },
                {
                    processReply: (userText) => {
                        return {
                            nextPrompt: "That sounds absolutely wonderful! Doing things you love is key to a happy life. Keep doing it! What is your main goal for learning English?",
                            suggestions: ["I want to speak English fluently when traveling.", "I want to improve my career options."]
                        };
                    }
                },
                {
                    processReply: (userText) => {
                        return {
                            nextPrompt: "An inspiring goal! You are doing amazing. Practice makes perfect, and you are getting better every day. Good luck!",
                            suggestions: [],
                            isFinal: true
                        };
                    }
                }
            ]
        }
    };

    // เปิดใช้งาน Web Speech Recognition สำหรับพูดคุย
    useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            setRecognitionSupported(false);
            return;
        }

        const rec = new SpeechRecognition();
        rec.continuous = false;
        rec.interimResults = false;
        rec.lang = 'en-US';

        rec.onstart = () => {
            setIsListening(true);
            setTranscript("");
        };

        rec.onerror = (e) => {
            console.error("Speech Recognition Error", e);
            setIsListening(false);
        };

        rec.onend = () => {
            setIsListening(false);
        };

        rec.onresult = (e) => {
            const speechToText = e.results[0][0].transcript;
            setTranscript(speechToText);
            handleSendUserMessage(speechToText);
        };

        recognitionRef.current = rec;
    }, [activeScenario, currentStep]);

    // เล่นเสียงประโยคแรกของ AI เมื่อเลือกห้อง
    useEffect(() => {
        if (activeScenario) {
            const firstPrompt = SCENARIOS[activeScenario].steps[0].aiPrompt;
            setChatHistory([
                { role: 'ai', text: firstPrompt }
            ]);
            setSuggestions(SCENARIOS[activeScenario].steps[0].userSuggestions);
            setCurrentStep(0);
            setShowResults(false);

            // พูดเสียง
            setTimeout(() => {
                if (window.Utils?.speak) {
                    window.Utils.speak(firstPrompt, 'en-US', settings?.speed || 1.0);
                }
            }, 500);
        }
    }, [activeScenario]);

    // เลื่อนลงไปข้างล่างแชทเมื่อมีข้อความใหม่
    useEffect(() => {
        if (messagesEndRef.current) {
            messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
    }, [chatHistory]);

    const startRecording = () => {
        if (recognitionRef.current && !isListening) {
            try {
                recognitionRef.current.start();
            } catch(err) {
                console.warn(err);
            }
        }
    };

    const stopRecording = () => {
        if (recognitionRef.current && isListening) {
            recognitionRef.current.stop();
        }
    };

    const handleSendUserMessage = (text) => {
        if (!text.trim() || isThinking) return;

        // บันทึกข้อความผู้ใช้ลงแชท
        setChatHistory(prev => [...prev, { role: 'user', text: text }]);
        setIsThinking(true);

        const currentScenarioData = SCENARIOS[activeScenario];
        const stepData = currentScenarioData.steps[currentStep];

        setTimeout(() => {
            // คำนวณหาคำตอบของ AI ถัดไป
            const result = stepData.processReply(text);
            
            setChatHistory(prev => [...prev, { role: 'ai', text: result.nextPrompt }]);
            
            if (result.isFinal) {
                setSuggestions([]);
                setShowResults(true);
            } else {
                setSuggestions(result.suggestions);
                setCurrentStep(prev => prev + 1);
            }

            setIsThinking(false);

            // AI ออกเสียงพูด
            if (window.Utils?.speak) {
                window.Utils.speak(result.nextPrompt, 'en-US', settings?.speed || 1.0);
            }
        }, 1200);
    };

    return (
        <div className="fixed inset-0 z-[120] bg-gradient-to-br from-[#080B11] via-[#0E131F] to-[#17132B] flex flex-col h-full w-full overflow-hidden text-slate-200 animate-fade-in">
            {/* Header */}
            <div className="px-5 py-4 flex items-center justify-between z-10 bg-[#080B11]/85 backdrop-blur-xl border-b border-white/[0.05] shrink-0">
                <button onClick={onClose} className="p-2 -ml-2 text-slate-400 hover:text-white bg-white/5 rounded-full hover:scale-105 active:scale-95 transition-all">
                    {XIcon ? <XIcon size={20} /> : '✕'}
                </button>
                <div className="flex flex-col items-center">
                    <span className="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] leading-none">AI Interactive Dialogue</span>
                    <span className="text-xs font-bold text-slate-200 mt-1.5 flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                        {activeScenario ? SCENARIOS[activeScenario].title : "AI Voice Talk"}
                    </span>
                </div>
                <div className="w-8"></div>
            </div>

            {/* Scenario Selection View */}
            {!activeScenario ? (
                <div className="flex-1 overflow-y-auto px-6 py-8 flex flex-col justify-center max-w-md mx-auto w-full space-y-6">
                    <div className="text-center space-y-2">
                        <div className="w-16 h-16 rounded-3xl bg-blue-500/10 border border-blue-500/20 mx-auto flex items-center justify-center text-3xl shadow-lg">
                            🎙️
                        </div>
                        <h2 className="text-2xl font-black text-white tracking-tight">AI Voice Dialogue Lab</h2>
                        <p className="text-xs text-slate-500">เลือกสถานการณ์จำลองภาษาอังกฤษ เพื่อฝึกพูดตอบโต้เสียงกับ AI เสมือนจริง</p>
                    </div>

                    <div className="space-y-4 pt-4">
                        {Object.entries(SCENARIOS).map(([key, value]) => (
                            <div 
                                key={key}
                                onClick={() => setActiveScenario(key)}
                                className="backdrop-blur-md bg-white/[0.02] border border-white/[0.05] hover:border-blue-500/30 hover:bg-white/[0.04] p-5 rounded-2xl cursor-pointer flex items-center gap-4 transition-all duration-300 group active:scale-[0.98] shadow-lg"
                            >
                                <div className="w-12 h-12 rounded-2xl bg-[#04060A]/80 border border-white/5 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                                    {value.icon}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <h4 className="text-sm font-extrabold text-white group-hover:text-blue-400 transition-colors">{value.title}</h4>
                                    <p className="text-[10px] text-slate-500 mt-1">{value.subtitle}</p>
                                </div>
                                <span className="material-symbols-outlined text-slate-500 group-hover:text-blue-400 transition-colors">chevron_right</span>
                            </div>
                        ))}
                    </div>
                </div>
            ) : (
                /* Chat Dialogue View */
                <div className="flex-1 flex flex-col overflow-hidden max-w-md mx-auto w-full relative">
                    
                    {/* Chat Messages Log */}
                    <div className="flex-1 overflow-y-auto p-5 space-y-4" style={{ scrollbarWidth: 'none' }}>
                        {chatHistory.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end animate-slide-left' : 'justify-start animate-slide-right'}`}>
                                <div className={`flex gap-3 max-w-[85%] ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                                    {/* Avatar */}
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 border text-sm font-bold shadow-inner ${
                                        msg.role === 'user' 
                                            ? 'bg-blue-600 border-blue-500 text-white' 
                                            : 'bg-white/[0.04] border-white/5 text-slate-300'
                                    }`}>
                                        {msg.role === 'user' ? 'Me' : 'AI'}
                                    </div>
                                    {/* Message Text Bubble */}
                                    <div className={`p-4 rounded-3xl text-sm leading-relaxed relative ${
                                        msg.role === 'user'
                                            ? 'bg-gradient-to-r from-blue-600 to-blue-500 text-white font-semibold rounded-tr-sm shadow-md'
                                            : 'bg-white/[0.02] text-slate-200 border border-white/[0.06] rounded-tl-sm shadow-inner'
                                    }`}>
                                        <p>{msg.text}</p>
                                        
                                        {/* Speak Button (Replay for AI) */}
                                        {msg.role === 'ai' && (
                                            <button 
                                                onClick={() => window.Utils?.speak && window.Utils.speak(msg.text, 'en-US', settings?.speed || 1.0)}
                                                className="absolute -bottom-3 -right-2 p-1.5 bg-[#0F1422] hover:bg-[#151D31] text-slate-400 hover:text-white rounded-full border border-white/5 shadow-md transition-colors"
                                            >
                                                {Volume2Icon ? <Volume2Icon size={12} /> : '🔊'}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))}

                        {/* AI thinking buble */}
                        {isThinking && (
                            <div className="flex justify-start items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-white/[0.04] border border-white/5 flex items-center justify-center text-sm font-bold animate-spin text-blue-400">
                                    ⏳
                                </div>
                                <div className="bg-white/[0.01] border border-white/5 text-slate-500 px-4 py-2.5 rounded-2xl rounded-tl-sm text-xs animate-pulse">
                                    AI is typing...
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    {/* Completion Screen Overlay */}
                    {showResults && (
                        <div className="absolute inset-0 bg-[#080B11]/95 backdrop-blur-md z-30 flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                            <div className="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl mb-4 animate-bounce">
                                🏆
                            </div>
                            <h3 className="text-xl font-black text-white">Conversation Complete!</h3>
                            <p className="text-xs text-slate-500 mt-2 max-w-xs">ยอดเยี่ยมมากครับ! คุณได้โต้ตอบจำลองตามหัวข้อและฝึกสำเนียงสำเร็จแล้ว</p>
                            
                            <div className="bg-white/[0.02] border border-white/[0.05] p-4.5 rounded-2xl w-full max-w-xs mt-6 text-left space-y-3.5 shadow-inner">
                                <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Fluency Checklist</h4>
                                <div className="flex items-center gap-2.5 text-xs text-slate-300">
                                    {CheckCircleIcon ? <CheckCircleIcon size={14} className="text-emerald-400 fill-emerald-500/10" /> : '✓'}
                                    <span>ฝึกตอบโต้ครบขั้นตอนของบทสนทนา</span>
                                </div>
                                <div className="flex items-center gap-2.5 text-xs text-slate-300">
                                    {CheckCircleIcon ? <CheckCircleIcon size={14} className="text-emerald-400 fill-emerald-500/10" /> : '✓'}
                                    <span>ใช้ศัพท์พื้นฐานถูกต้องและเหมาะสม</span>
                                </div>
                                <div className="flex items-center gap-2.5 text-xs text-slate-300">
                                    {CheckCircleIcon ? <CheckCircleIcon size={14} className="text-emerald-400 fill-emerald-500/10" /> : '✓'}
                                    <span>พัฒนาการออกเสียงสูงเหมือนมนุษย์</span>

            setIsPlaying(false);
            setActiveSentenceIdx(-1);
            return;
        }

        setActiveSentenceIdx(index);
        setIsPlaying(true);

        const text = STORIES[activeStory].sentences[index].en;

        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = playbackSpeed;

        // ค้นหาเสียงพรีเมียมเสมือนมนุษย์
        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
            const enVoices = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith('en'));
            let selectedVoice = enVoices.find(v => v.name.toLowerCase().includes('premium') || v.name.toLowerCase().includes('natural'));
            if (!selectedVoice) {
                selectedVoice = enVoices.find(v => v.name.toLowerCase().includes('google'));
            }
            if (!selectedVoice) {
                selectedVoice = enVoices.find(v => v.name.toLowerCase().includes('samantha') || v.name.toLowerCase().includes('apple'));
            }
            if (!selectedVoice && enVoices.length > 0) {
                selectedVoice = enVoices[0];
            }
            if (selectedVoice) utterance.voice = selectedVoice;
        }

        // เมื่ออ่านจบประโยคนี้ ให้เล่นประโยคถัดไปโดยอัตโนมัติ
        utterance.onend = () => {
            if (isPlaying) {
                const nextIndex = index + 1;
                if (nextIndex < STORIES[activeStory].sentences.length) {
                    playSentence(nextIndex);
                } else {
                    setIsPlaying(false);
                    setActiveSentenceIdx(-1);
                }
            }
        };

        utterance.onerror = () => {
            setIsPlaying(false);
        };

        utteranceRef.current = utterance;
        window.speechSynthesis.speak(utterance);
    };

    const handlePlayPause = () => {
        if (isPlaying) {
            window.speechSynthesis.cancel();
            setIsPlaying(false);
        } else {
            const targetIdx = activeSentenceIdx === -1 ? 0 : activeSentenceIdx;
            playSentence(targetIdx);

        setIsPlaying(false);
        setActiveSentenceIdx(-1);

    useEffect(() => {

    // คีย์สำหรับค้นหาและการเปิดแผงคำสั่ง Custom Card
    const [searchQuery, setSearchQuery] = useState("");
    const [showAddCardPanel, setShowAddCardPanel] = useState(false);
    const [customEn, setCustomEn] = useState("");
    const [customTh, setCustomTh] = useState("");

    const session = SessionData[activeSessionIdx];

    useEffect(() => { 
        if(SessionData[activeSessionIdx]) {
            setActiveCat(SessionData[activeSessionIdx].data[0]?.id); 
        }
    }, [activeSessionIdx, SessionData]);

    const currentCatCards = session?.data.find(c => c.id === activeCat)?.sentences.map((_, i) => `${activeCat}-${i}`) || [];
    const allSessCards = session?.data.flatMap(cat => cat.sentences.map((_, i) => `${cat.id}-${i}`)) || [];
    
    const targetCatIDs = currentCatCards;
    const targetSessIDs = allSessCards;
    
    const isCatAll = targetCatIDs.length > 0 && targetCatIDs.every(id => selectedCards.includes(id));
    const isSessAll = targetSessIDs.length > 0 && targetSessIDs.every(id => selectedCards.includes(id));

    const handleCancelSelection = () => {
        if (clearSelection) clearSelection(); 
        setIsSelectionMode(false); 
    };

    const handleCreateCustomCard = (e) => {
        e.preventDefault();
        if (!customEn.trim() || !customTh.trim()) {
            alert("กรุณากรอกทั้งภาษาอังกฤษและภาษาไทยให้ครบถ้วนครับ");
            return;
        }
        if (onAddCustomCard) {
            onAddCustomCard({ en: customEn.trim(), th: customTh.trim() });
            setCustomEn("");
            setCustomTh("");
            setShowAddCardPanel(false);
        }
    };

    const srsValidCount = selectedCards.filter(id => !(srsData[id] && srsData[id].nextReview > Date.now())).length;

    // กรองการ์ดประโยคตามแถบค้นหา (Global Search)
    const filteredSentences = (sentences, catId) => {
        if (!searchQuery.trim()) return sentences;
        const q = searchQuery.toLowerCase();
        return sentences.filter(s => 
            s.en.toLowerCase().includes(q) || 
            s.th.toLowerCase().includes(q)
        );
    };

    return (
        <div className="bg-gradient-to-br from-[#0B0F19] via-[#111827] to-[#1F1A3A] flex flex-col animate-fade-in relative min-h-screen text-slate-200">

                    const sentencesToShow = filteredSentences(cat.sentences || [], cat.id);
                    if (searchQuery.trim() && sentencesToShow.length === 0) return null;

                    return (
                        <div key={cat.id} className="space-y-3 animate-fade-in">
                            {searchQuery.trim() && (
                                <h4 className="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest px-2 mb-1">{cat.title}</h4>
                            )}
                            {sentencesToShow.map((s) => {
                                // ดึงตำแหน่งดัชนีของประโยคเพื่อประกอบเป็น ID
                                const idx = cat.sentences.indexOf(s);
                                const uId = `${cat.id}-${idx}`;
                                const card = allSentencesFlat.find(sf => sf.uniqueId === uId);
                                if (!card) return null;
                                
                                const isLocked = srsData[uId] && srsData[uId].nextReview > Date.now();
                                const isCustom = card.sessionId === 'custom-session';

                                return (
                                    <ChunkedSentenceCard 
                                        key={uId} 
                                        sentence={card} 
                                        isActive={activeId === uId} 
                                        onClick={() => setActiveId(activeId === uId ? null : uId)} 
                                        onSaveSRS={onSaveSRS} 
                                        langToggle={langToggle} 
                                        isSelectionMode={isSelectionMode} 
                                        isSelected={selectedCards.includes(uId)} 
                                        onToggleSelect={() => toggleCardSelection(uId)} 
                                        isBookmarked={bookmarks.includes(uId)} 
                                        onToggleBookmark={() => toggleBookmark(uId)} 
                                        isLocked={isLocked} 
                                        isCustom={isCustom}
                                        onDeleteCustomCard={() => onDeleteCustomCard && onDeleteCustomCard(uId)}
                                    />
                                );
                            })}
                        </div>
                    );
                })}

                {/* Empty State when Search has no results */}
                {searchQuery.trim() && !session?.data.some(cat => filteredSentences(cat.sentences || [], cat.id).length > 0) && (
                    <div className="flex flex-col items-center justify-center py-20 opacity-40">
                        <span className="material-symbols-outlined text-5xl text-slate-600 mb-3">search_off</span>
                        <p className="text-slate-400 font-bold text-sm">No matching sentences found</p>
                        <p className="text-xs text-slate-500 mt-1">Try another search term</p>
                    </div>
                )}
            </div>

            {/* Selection Sticky Action Buttons */}
            {selectedCards.length > 0 && (
                <div className="fixed bottom-24 left-0 right-0 px-5 flex flex-col gap-2.5 z-30 animate-fade-in pointer-events-auto max-w-sm mx-auto">

                    >
                        {PlayIcon ? <PlayIcon size={16} className="fill-navy-900" /> : '▶'} Custom Study ({srsValidCount})
                    </button>
                    
                    <div className="flex gap-2 w-full">
                        <button 
                            onClick={onStartPracticeReview} 
                            className="flex-1 bg-white text-navy-900 shadow-xl rounded-2xl py-3.5 font-bold flex items-center justify-center gap-2 uppercase text-[10px] tracking-wider active:scale-95 transition-transform border border-white/10"
                        >
                            {CardsIcon ? <CardsIcon size={14} className="fill-slate-400" /> : '🗂️'} Flash Card ({selectedCards.length})
                        </button>
                        
                        <button 
                            onClick={onStartTypingReview} 
                            className="flex-1 bg-blue-600 text-white shadow-[0_4px_15px_rgba(37,99,235,0.3)] rounded-2xl py-3.5 font-bold flex items-center justify-center gap-2 uppercase text-[10px] tracking-wider active:scale-95 transition-transform border border-blue-500/20"
                        >
                            <span className="material-symbols-outlined text-sm">keyboard</span>
                            <span>Typing ({selectedCards.length})</span>
                        </button>
                    </div>
                </div>
            )}
        </div>
    );
};

window.FlashcardQuizView = ({ quizQueue, settings, onClose, onSaveSRS, onOpenSettings }) => {
    const { useState, useEffect } = React;
    
    const Fallback = () => <span style={{color:'red'}}>?</span>;
    const Icons = window.Icons || {};
    const XIcon = Icons.XIcon || Fallback;
    const SlidersIcon = Icons.SlidersIcon || Fallback;
    const Volume2Icon = Icons.Volume2Icon || Fallback;
    const BookIcon = Icons.BookIcon || Fallback;
    const CheckCircleIcon = Icons.CheckCircleIcon || Fallback;

    const [currentIndex, setCurrentIndex] = useState(0);
    const [showAnswer, setShowAnswer] = useState(false);

    const currentCard = quizQueue[currentIndex];
    
    const isThaiFront = settings.cardFront === 'th';
    const frontText = isThaiFront ? currentCard?.th : currentCard?.en;
    const backText = isThaiFront ? currentCard?.en : currentCard?.th;
    
    const speakText = isThaiFront ? currentCard?.en : currentCard?.th;
    const speakLang = isThaiFront ? 'en-US' : 'th-TH';

    // เล่นเสียงอัตโนมัติเมื่อกดแสดงคำเฉลย
    useEffect(() => {
        if (settings.autoPlay && showAnswer && currentCard && window.Utils && window.Utils.speak) {
            window.Utils.speak(speakText, speakLang, settings.speed);
        }
    }, [currentIndex, showAnswer, currentCard, settings, speakText, speakLang]);

    // จัดการคีย์บอร์ดลัด (Anki Parity Keyboard Shortcuts)
    useEffect(() => {
        const handleKeyDown = (e) => {
            if (!currentCard) return;
            
            if (!showAnswer) {
                // กด Spacebar หรือ Enter เพื่อพลิกการ์ดเฉลย
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    setShowAnswer(true);
                }
            } else {
                // กดคีย์ 1-4 เพื่อให้คะแนน หรือกด Space/Enter อีกรอบเพื่อเลือก 'good' (เป็นค่ากลาง)
                if (e.key === '1') {
                    e.preventDefault();
                    handleRate('again');
                } else if (e.key === '2') {
                    e.preventDefault();
                    handleRate('hard');
                } else if (e.key === '3') {
                    e.preventDefault();
                    handleRate('good');
                } else if (e.key === '4') {
                    e.preventDefault();
                    handleRate('easy');
                } else if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    handleRate('good');
                }
            }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [showAnswer, currentIndex, currentCard, quizQueue]);

    if (!currentCard) {
        return (
            <div className="fixed inset-0 z-50 bg-[#080B11] flex flex-col items-center justify-center animate-fade-in p-6">
                <div className="text-brand-yellow mb-6 text-6xl animate-bounce">🎉</div>
                <h2 className="text-3xl font-black text-white mb-2">Review Complete!</h2>
                <p className="text-slate-400 text-sm mb-8 text-center max-w-xs">You've successfully studied all scheduled items in this session.</p>
                <button onClick={onClose} className="px-8 py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-navy-950 font-black rounded-2xl shadow-lg hover:shadow-yellow-500/20 active:scale-95 transition-all uppercase text-sm tracking-wider">
                    Go Back To Dashboard
                </button>
            </div>
        );
    }

    const handleRate = (rating) => {
        setShowAnswer(false); 
        onSaveSRS(currentCard.uniqueId, rating);
        if (currentIndex < quizQueue.length - 1) {
            setCurrentIndex(prev => prev + 1);
        } else {
            onClose(); 
        }
    };

    return (
        <div className="fixed inset-0 z-[60] bg-gradient-to-br from-[#080B11] via-[#0E131F] to-[#17132B] flex flex-col h-full w-full overflow-hidden animate-fade-in text-slate-200">
            {/* Background Decorative Glow */}
            <div className="absolute top-1/3 left-1/2 -translate-x-1/2 w-[300px] h-[300px] bg-brand-yellow/5 rounded-full blur-[100px] pointer-events-none"></div>

            {/* Header */}
            <div className="px-5 py-4 flex items-center justify-between z-10 bg-navy-900/40 backdrop-blur-md shrink-0 border-b border-white/[0.05]">
                <button onClick={onClose} className="p-2 -ml-2 text-slate-400 hover:text-white bg-white/5 rounded-full hover:scale-105 active:scale-95 transition-all">
                    <XIcon size={20} />
                </button>
                <div className="flex flex-col items-center">
                    <span className="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] leading-none">SRS SuperMemo Engine</span>
                    <span className="text-xs font-bold text-slate-200 mt-1.5 flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-brand-yellow animate-ping"></span>
                        Active Review Session
                    </span>
                </div>
                <button onClick={onOpenSettings} className="p-2 -mr-2 text-slate-400 hover:text-white bg-white/5 rounded-full hover:scale-105 active:scale-95 transition-all">
                    <SlidersIcon size={18}/>
                </button>
            </div>
            
            {/* Session Progress Bar */}
            <div className="px-6 mb-4 mt-3 shrink-0 max-w-md mx-auto w-full">
                <div className="flex justify-between text-[9px] font-black text-slate-500 mb-2 uppercase tracking-widest">
                    <span>CARDS PROGRESS</span>
                    <span className="text-brand-yellow font-black">{currentIndex + 1} / {quizQueue.length}</span>
                </div>
                <div className="w-full h-1.5 bg-[#04060A] border border-white/5 rounded-full overflow-hidden shadow-inner">
                    <div className="h-full bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 transition-all duration-300 rounded-full" style={{ width: `${((currentIndex + 1) / quizQueue.length) * 100}%` }}></div>
                </div>
            </div>

            {/* Main Interactive Flipcard Area */}
            <div className="flex-1 flex flex-col px-5 pb-6 overflow-hidden max-w-md mx-auto w-full">
                
                {/* 3D perspective structure */}
                <div className="flex-1 perspective-1000 relative select-none">
                    
                    {/* Flipping container */}
                    <div 
                        onClick={() => { if(!showAnswer) setShowAnswer(true); }}
                        className={`w-full h-full transform-style-3d transition-transform duration-500 relative cursor-pointer ${
                            showAnswer ? 'rotate-y-180' : ''
                        }`}
                    >
                        {/* 🌟 FRONT FACE (Question) */}
                        <div className="absolute inset-0 w-full h-full backface-hidden backdrop-blur-xl bg-white/[0.02] border border-white/[0.08] rounded-[2.5rem] shadow-2xl flex flex-col p-6 overflow-hidden">
                            <div className="flex justify-between items-center w-full pb-4 border-b border-white/[0.04]">
                                <span className="border border-brand-yellow/30 text-brand-yellow text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest bg-brand-yellow/10">
                                    Question Front
                                </span>
                                <button 
                                    onClick={(e) => { 
                                        e.stopPropagation(); 
                                        if(window.Utils && window.Utils.speak) window.Utils.speak(isThaiFront ? currentCard?.th : currentCard?.en, isThaiFront ? 'th-TH' : 'en-US', settings.speed); 
                                    }} 
                                    className="p-2 hover:bg-white/5 text-slate-400 hover:text-white rounded-full transition-colors active:scale-90"
                                >
                                    <Volume2Icon size={18} />
                                </button>
                            </div>
                            
                            <div className="flex-1 flex flex-col items-center justify-center p-4">
                                <span className="text-[10px] text-slate-500 font-extrabold uppercase tracking-[0.2em] mb-4">
                                    {isThaiFront ? 'แปลประโยคภาษาไทยเป็นภาษาอังกฤษ' : 'Translate English to Thai'}
                                </span>
                                <h3 className="text-xl md:text-2xl font-bold text-white leading-relaxed tracking-wide text-center">
                                    {frontText}
                                </h3>
                                
                                <div className="mt-8 bg-white/[0.02] border border-white/5 rounded-2xl px-4 py-2 flex items-center gap-1.5 text-slate-500 hover:text-slate-400 hover:border-white/10 active:scale-95 transition-all text-[10px] font-bold uppercase tracking-wider animate-pulse">
                                    <span>Tap Card or Press [Space] to flip</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center justify-center opacity-25 pb-4">
                                <BookIcon size={20}/>
                            </div>
                        </div>

                        {/* 🌟 BACK FACE (Answer) */}
                        <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 backdrop-blur-xl bg-[#0F1422]/90 border border-white/[0.08] rounded-[2.5rem] shadow-2xl flex flex-col p-6 overflow-hidden">
                            <div className="flex justify-between items-center w-full pb-4 border-b border-white/[0.04]">
                                <span className="border border-emerald-500/30 text-emerald-400 text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest bg-emerald-500/10">
                                    Answer Back
                                </span>
                                <button 
                                    onClick={(e) => { 
                                        e.stopPropagation(); 
                                        if(window.Utils && window.Utils.speak) window.Utils.speak(speakText, speakLang, settings.speed); 
                                    }} 
                                    className="p-2 hover:bg-white/5 text-slate-400 hover:text-white rounded-full transition-colors active:scale-90"
                                >
                                    <Volume2Icon size={18} />
                                </button>
                            </div>

                                <div className="space-y-1.5 w-full">
                                    <p className="text-[8px] text-slate-500 font-black tracking-widest uppercase">Question</p>
                                    <h4 className="text-sm font-semibold text-slate-400 leading-normal">{frontText}</h4>
                                </div>
                                <div className="w-12 h-[1px] bg-white/[0.05] rounded-full mx-auto"></div>
                                <div className="space-y-2 w-full">
                                    <p className="text-[8px] text-brand-yellow font-black tracking-widest uppercase">Correct Translation</p>
                                    <h3 className="text-xl md:text-2xl font-black text-emerald-400 leading-relaxed tracking-wide drop-shadow-[0_0_12px_rgba(52,211,153,0.25)]">

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {/* SRS Score Ratings Action Panel (Visible below card when flipped) */}
            <div className={`p-5 bg-navy-950/60 border-t border-white/[0.05] backdrop-blur-xl shrink-0 z-20 transition-all duration-300 transform ${

                <div className="max-w-md mx-auto space-y-3.5">

    const [isGranted, setIsGranted] = useState(NotificationService.checkPermission());

const FloatingAIChat = () => {
    const { useState, useRef, useEffect } = React;
    const { XIcon } = window.Icons || {};
    
    const BACKEND_URL = "/api/chat"; 

    const [isOpen, setIsOpen] = useState(false);
    const [input, setInput] = useState("");
    const [messages, setMessages] = useState([
        { role: 'ai', text: 'มีประโยคไหนในแอปที่สงสัย พิมพ์ถามผมได้เลยครับ! 😊' }
    ]);
    const [isLoading, setIsLoading] = useState(false);
    const messagesEndRef = useRef(null);

    const chatHeadRef = useRef(null);
    const dragInfo = useRef({
        isDragging: false,
        currentX: window.innerWidth - 80,
        currentY: window.innerHeight - 150,
        startX: 0, startY: 0,
        isMoved: false
    });

    useEffect(() => {
        if (chatHeadRef.current) {
            chatHeadRef.current.style.left = `${dragInfo.current.currentX}px`;
            chatHeadRef.current.style.top = `${dragInfo.current.currentY}px`;
        }
    }, []);

    useEffect(() => {
        if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
    }, [messages, isOpen]);

    const handlePointerDown = (e) => {
        dragInfo.current.isDragging = true;
        dragInfo.current.isMoved = false;
        dragInfo.current.startX = (e.clientX || e.touches?.[0].clientX) - dragInfo.current.currentX;
        dragInfo.current.startY = (e.clientY || e.touches?.[0].clientY) - dragInfo.current.currentY;
        e.target.setPointerCapture(e.pointerId);
    };

    const handlePointerMove = (e) => {
        if (!dragInfo.current.isDragging) return;
        
        const x = (e.clientX || e.touches?.[0].clientX) - dragInfo.current.startX;
        const y = (e.clientY || e.touches?.[0].clientY) - dragInfo.current.startY;
        
        if (Math.abs(x - dragInfo.current.currentX) > 3 || Math.abs(y - dragInfo.current.currentY) > 3) {
            dragInfo.current.isMoved = true;
        }

        const clampedX = Math.max(10, Math.min(x, window.innerWidth - 70));
        const clampedY = Math.max(10, Math.min(y, window.innerHeight - 70));

        dragInfo.current.currentX = clampedX;
        dragInfo.current.currentY = clampedY;

        requestAnimationFrame(() => {
            if (chatHeadRef.current) {
                chatHeadRef.current.style.left = `${clampedX}px`;
                chatHeadRef.current.style.top = `${clampedY}px`;
            }
        });
    };

    const handlePointerUp = (e) => {
        if (!dragInfo.current.isDragging) return;
        dragInfo.current.isDragging = false;
        e.target.releasePointerCapture(e.pointerId);

        if (!dragInfo.current.isMoved) {
            setIsOpen(true);
        }
    };
    
    const handleSendMessage = async () => {
        if (!input.trim()) return;

        const userMsg = input;
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setInput("");
        setIsLoading(true);

        try {
            const systemPrompt = `คุณคือผู้ช่วยอัจฉริยะประจำแอป "ESB Thai" (English Sentence Bank) ข้อมูลแอปเบื้องต้น:
            - แอปนี้ใช้ฝึกภาษาอังกฤษด้วยระบบ SRS
            - โหมด Study: ใช้เปิดดูประโยคใหม่ๆ พร้อมคำแปล และระบบสร้างการ์ดคำศัพท์ของตนเอง
            - โหมด Review: ใช้ทดสอบความจำด้วยระบบ 3D Flip Flashcards
            - โหมด Typing: ใช้ฝึกพิมพ์ประโยคตามคำแปลพร้อม Real-time Diff Check
            กฎ: ตอบคำถามเกี่ยวกับภาษาอังกฤษ แกรมม่า คำแปล ได้อย่างถูกต้อง สั้นๆ กระชับ เป็นมิตร ห้ามใช้ Markdown`;
            
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMsg, systemPrompt: systemPrompt })
            });

            const data = await response.json();
            
            if (response.ok) {
                setMessages(prev => [...prev, { role: 'ai', text: data.reply }]);
            } else {
                setMessages(prev => [...prev, { role: 'ai', text: `⚠️ Error: ${data.error}` }]);
            }
        } catch (error) {
            setMessages(prev => [...prev, { role: 'ai', text: `⚠️ เชื่อมต่อไม่ได้: ${error.message}` }]);
        } finally {
            setIsLoading(false);
        }
    };

    return (
        <>
            {isOpen && (
                <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm animate-fade-in" onPointerDown={() => setIsOpen(false)}></div>
                    <div className="relative w-full max-w-[340px] h-[480px] max-h-[80vh] bg-[#0B1121]/90 backdrop-blur-xl border border-white/10 rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden animate-scale-in">
                        <div className="px-5 py-4 border-b border-white/10 flex justify-between items-center bg-navy-900/40">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl animate-pulse">🤖</span>
                                <span className="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase">English Assistant</span>
                            </div>
                            <button onClick={() => setIsOpen(false)} className="p-2 text-slate-500 hover:text-white transition-colors bg-white/5 rounded-full">
                                {XIcon ? <XIcon size={16}/> : '✕'}
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-4" style={{ scrollbarWidth: 'none' }}>
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3.5 rounded-2xl text-[13px] leading-relaxed ${msg.role === 'user' ? 'bg-gradient-to-r from-amber-400 to-yellow-500 text-navy-900 font-extrabold rounded-tr-sm' : 'bg-white/[0.04] text-slate-200 border border-white/5 rounded-tl-sm shadow-sm'}`}>
                                {msg.text}
                                </div>
                            </div>
                            ))}
                            {isLoading && (
                                <div className="flex justify-start animate-pulse">
                                    <div className="bg-white/[0.04] border border-white/5 text-slate-500 p-3 rounded-2xl rounded-tl-sm text-xs">AI กำลังคิด...</div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                        <div className="p-4 bg-navy-900/20 border-t border-white/[0.06]">
                            <div className="flex bg-[#0b0f19]/80 border border-white/10 rounded-2xl overflow-hidden focus-within:border-brand-yellow/50 transition-all shadow-inner">
                                <input 
                                    type="text" 
                                    value={input} 
                                    onChange={(e) => setInput(e.target.value)} 
                                    onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                                    placeholder="พิมพ์คำถามที่นี่..." 
                                    className="flex-1 bg-transparent text-white text-xs px-4 py-3 outline-none"
                                />
                                <button onClick={handleSendMessage} className="px-5 text-brand-yellow font-extrabold text-xs hover:text-yellow-400 active:bg-white/5">ส่ง</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            <div 
                ref={chatHeadRef}
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                className={`fixed z-[999] w-14 h-14 rounded-full bg-navy-900/90 border-2 border-brand-yellow shadow-[0_0_20px_rgba(250,204,21,0.4)] flex items-center justify-center text-2xl cursor-grab active:cursor-grabbing touch-none select-none hover:scale-105 active:scale-95 ${isOpen ? 'opacity-0 pointer-events-none scale-0' : 'opacity-100 scale-100'} transition-all duration-300`}
                style={{ position: 'fixed' }}
            >
                🤖
            </div>
        </>
    );
};
