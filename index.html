    <!-- PREMIUM ERROR OVERLAY FOR FILE:// PROTOCOL WINDOWS DEVS -->
    <script>
        function showErrorOverlay(message, source, lineno, colno, error) {
            if (document.getElementById('error-overlay')) return;
            const errorDiv = document.createElement('div');
            errorDiv.id = 'error-overlay';
            errorDiv.style.position = 'fixed';
            errorDiv.style.inset = '0';
            errorDiv.style.zIndex = '999999';
            errorDiv.style.backgroundColor = 'rgba(6, 10, 19, 0.97)';
            errorDiv.style.backdropFilter = 'blur(16px)';
            errorDiv.style.color = '#F87171';
            errorDiv.style.padding = '24px';
            errorDiv.style.fontFamily = '"Plus Jakarta Sans", Inter, system-ui, sans-serif';
            errorDiv.style.overflowY = 'auto';
            errorDiv.style.display = 'flex';
            errorDiv.style.alignItems = 'center';
            errorDiv.style.justifyContent = 'center';
            
            let stackHTML = '';
            if (error && error.stack) {
                stackHTML = "<pre style='background: #020408; color: #94A3B8; padding: 16px; border-radius: 12px; font-size: 11px; font-family: monospace; overflow-x: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid rgba(255,255,255,0.03); margin-top: 12px; text-align: left; max-height: 200px;'>" + error.stack + "</pre>";
            } else if (message && (message.indexOf('SyntaxError') !== -1 || message.indexOf('Babel') !== -1)) {
                stackHTML = "<div style='color: #64748B; font-size: 11px; margin-top: 12px; text-align: left;'>๐’ก Suggestion: Check the syntax of React JSX, such as closing tags, brackets, quotes or variables in your code.</div>";
            }
            
            errorDiv.innerHTML = 
                <div style="max-width: 500px; width: 100%; background: #0B1121; border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 28px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); text-align: center; font-size: 14px;">
                    <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 28px;">[!]</div>
                    <h3 style="color: #FFFFFF; font-size: 22px; font-weight: 800; margin: 0 0 8px 0; tracking: -0.02em;">Application Error Caught</h3>
                    <p style="color: #64748B; font-size: 13px; margin: 0 0 24px 0;">We detected a script loading or runtime compilation error.</p>
                    <div style="background: rgba(6, 10, 19, 0.4); border: 1px solid rgba(255,255,255,0.03); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: left; font-family: monospace; border-left: 4px solid #EF4444;">
                        <div style="color: #F87171; font-weight: 700; font-size: 13px; line-height: 1.5; margin-bottom: 8px; word-break: break-word;"> + message + </div>
                        <div style="color: #475569; font-size: 10px; line-height: 1.4; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 8px;">
                            <div><strong>Source:</strong>  + (source || 'Babel standalone parser / compiler') + </div>
                            <div><strong>Location:</strong> Line  + (lineno || '?') + , Col  + (colno || '?') + </div>
                        </div>
                    </div>
                     + stackHTML + 
                    <div style="display: flex; gap: 12px; margin-top: 28px;">
                        <button onclick="window.location.reload()" style="flex: 1; background: #2563EB; color: white; border: none; padding: 14px 24px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s;">Reload Page</button>
                        <button onclick="localStorage.clear(); window.location.reload();" style="background: rgba(255,255,255,0.04); color: #94A3B8; border: 1px solid rgba(255,255,255,0.08); padding: 14px 18px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s;" title="Clear local storage settings and state">Reset App</button>
                    </div>
                </div>
            ;
            if (document.body) {
                document.body.appendChild(errorDiv);
            } else {
                window.addEventListener('DOMContentLoaded', () => { document.body.appendChild(errorDiv); });
            }
        }
        window.onerror = function(message, source, lineno, colno, error) {
            showErrorOverlay(message, source, lineno, colno, error);
            return false;
        };
        const _origConsoleError = console.error;
        console.error = function(...args) {
            _origConsoleError.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            if (msg.indexOf('SyntaxError') !== -1 || msg.indexOf('Babel') !== -1 || msg.indexOf('Failed') !== -1 || msg.indexOf('TypeError') !== -1 || msg.indexOf('ReferenceError') !== -1) {
                showErrorOverlay(msg, 'Console Error Interceptor', 0, 0, null);
            }
        };
    </script>

      { en: "There is a growing public concern that artificial intelligence might eventually replace millions of administrative jobs.", th: "มีความกังวลเพิ่มขึ้นในหมู่ประชาชนว่าในท้ายที่สุดปัญญาประดิษฐ์อาจเข้ามาแทนที่งานธุรการหลายล้านตำแหน่ง" },
      { en: "There is a growing concern that the current lack of affordable housing will lead to a severe social crisis.", th: "มีความกังวลเพิ่มขึ้นว่าการขาดแคลนที่อยู่อาศัยราคาจับต้องได้ในปัจจุบันจะนำไปสู่วิกฤตการณ์ทางสังคมที่รุนแรง" },
      { en: "There is a growing concern among parents that excessive use of social media negatively impacts teenagers' mental health.", th: "มีความกังวลเพิ่มขึ้นในหมู่ผู้ปกครองว่าการใช้โซเชียลมีเดียมากเกินไปส่งผลเสียต่อสุขภาพจิตของวัยรุ่น" },
      { en: "There is a growing concern that global supply chains will inevitably face further severe disruptions later this year.", th: "เริ่มมีความกังวลกันมากขึ้นว่าห่วงโซ่อุปทานระดับโลกจะเผชิญกับการหยุดชะงักอย่างรุนแรงอีกระลอกในช่วงปลายปีนี้อย่างหลีกเลี่ยงไม่ได้" },
      { en: "It is highly recommended that international passengers arrive at the airport at least three hours before their scheduled departure.", th: "ขอแนะนำเป็นอย่างยิ่งให้ผู้โดยสารระหว่างประเทศมาถึงสนามบินอย่างน้อยสามชั่วโมงก่อนเวลาออกเดินทางตามกำหนดการ" },
      { en: "It is highly recommended that users enable two-factor authentication to better protect their online personal accounts.", th: "ขอแนะนำอย่างยิ่งให้ผู้ใช้เปิดใช้งานการยืนยันตัวตนแบบสองขั้นตอนเพื่อปกป้องบัญชีส่วนตัวออนไลน์ให้ดียิ่งขึ้น" },
      { en: "It is highly recommended that amateur investors diversify their portfolios to minimize potential long-term financial risks.", th: "แนะนำเป็นอย่างยิ่งว่านักลงทุนมือใหม่ควรกระจายพอร์ตการลงทุนเพื่อลดความเสี่ยงทางการเงินที่อาจเกิดขึ้นในระยะยาว" },
      { en: "It is highly recommended that you consult a certified medical professional before starting this rigorous exercise program.", th: "ขอแนะนำอย่างยิ่งให้คุณปรึกษาแพทย์ผู้เชี่ยวชาญที่มีใบรับรองก่อนเริ่มโปรแกรมการออกกำลังกายที่เข้มงวดนี้" },
      { en: "As a result of the unexpected economic downturn, the promising startup was forced to cancel its rapid expansion plans.", th: "ผลจากภาวะเศรษฐกิจตกต่ำที่ไม่มีใครคาดคิด สตาร์ทอัพดาวรุ่งจึงถูกบีบให้ต้องยกเลิกแผนการขยายธุรกิจอย่างรวดเร็ว" },
      { en: "As a result of the newly implemented strict regulations, factories must severely restrict their chemical waste disposal processes.", th: "อันเป็นผลมาจากกฎระเบียบที่เข้มงวดซึ่งเพิ่งประกาศใช้ โรงงานต่างๆ ต้องจำกัดกระบวนการทิ้งขยะเคมีอย่างเข้มงวด" },
      { en: "As a result of the prolonged summer drought, agricultural yields in the northern region have dropped by thirty percent.", th: "ผลจากภัยแล้งในฤดูร้อนที่ยาวนาน ผลผลิตทางการเกษตรในพื้นที่ภาคเหนือจึงลดลงถึงสามสิบเปอร์เซ็นต์" },
      { en: "As a result of the massive online social media campaign, the local charity managed to raise millions of dollars.", th: "จากผลลัพธ์ของแคมเปญโซเชียลมีเดียออนไลน์ขนาดใหญ่ องค์กรการกุศลท้องถิ่นสามารถระดมทุนได้หลายล้านดอลลาร์" },
      { en: "Unless immediate preventative action is taken, the endangered animal species will likely face total extinction within a decade.", th: "เว้นเสียแต่ว่าจะมีการดำเนินการป้องกันในทันที สัตว์ป่าใกล้สูญพันธุ์สายพันธุ์นี้มีแนวโน้มที่จะสูญพันธุ์ทั้งหมดภายในหนึ่งทศวรรษ" },
      { en: "Unless immediate action is taken by the authorities, the structural damage to the old bridge could lead to a catastrophic collapse.", th: "หากเจ้าหน้าที่ไม่ดำเนินการแก้ไขโดยด่วน ความเสียหายทางโครงสร้างของสะพานเก่าอาจนำไปสู่การพังทลายครั้งใหญ่ได้" },
      { en: "Unless immediate economic action is taken, the ongoing inflation will severely damage the purchasing power of the middle class.", th: "เว้นแต่จะมีการใช้มาตรการทางเศรษฐกิจโดยด่วน ภาวะเงินเฟ้อที่ดำเนินอยู่จะทำลายกำลังซื้อของชนชั้นกลางอย่างรุนแรง" },
      { en: "Unless immediate action is taken to resolve the ongoing wage dispute, the factory workers will go on a nationwide strike.", th: "หากไม่มีการดำเนินการเร่งด่วนเพื่อแก้ไขข้อพิพาทเรื่องค่าจ้างที่ดำเนินอยู่ คนงานโรงงานจะทำการประท้วงหยุดงานทั่วประเทศ" },
      { en: "Researchers have recently discovered that certain specific types of bacteria can safely and naturally break down ocean plastics.", th: "นักวิจัยค้นพบเมื่อไม่นานมานี้ว่าแบคทีเรียเฉพาะบางชนิดสามารถย่อยสลายพลาสติกในมหาสมุทรได้อย่างปลอดภัยและเป็นธรรมชาติ" },
      { en: "Researchers have consistently discovered that regular meditation can physically alter the brain's structure to significantly reduce daily stress.", th: "นักวิจัยค้นพบอย่างต่อเนื่องว่าการทำสมาธิเป็นประจำสามารถปรับเปลี่ยนโครงสร้างของสมองทางกายภาพเพื่อลดความเครียดในแต่ละวันได้อย่างมีนัยสำคัญ" },
      { en: "Researchers have discovered a brand new exoplanet that potentially contains liquid water and a fully breathable atmosphere.", th: "นักวิจัยได้ค้นพบดาวเคราะห์นอกระบบดวงใหม่ล่าสุดที่อาจมีน้ำในสถานะของเหลวและชั้นบรรยากาศที่สามารถหายใจได้เต็มที่" },
      { en: "Researchers have discovered that the ancient civilization collapsed primarily due to prolonged environmental changes rather than foreign invasions.", th: "นักวิจัยค้นพบว่าอารยธรรมโบราณล่มสลายลงโดยมีสาเหตุหลักมาจากการเปลี่ยนแปลงของสภาพแวดล้อมที่ยืดเยื้อ ไม่ใช่จากการรุกรานของต่างชาติ" },
      { en: "While it is true that modern technology makes our lives easier, it also creates unprecedented and dangerous privacy concerns.", th: "แม้จะเป็นความจริงที่เทคโนโลยีสมัยใหม่ทำให้ชีวิตเราง่ายขึ้น แต่มันก็สร้างความกังวลด้านความเป็นส่วนตัวที่อันตรายและไม่เคยเกิดขึ้นมาก่อนด้วย" },
      { en: "While it is true that the stock market is highly volatile, it objectively remains the best vehicle for building long-term wealth.", th: "แม้จะจริงอยู่ที่ตลาดหุ้นมีความผันผวนสูงมาก แต่มันก็ยังคงเป็นเครื่องมือที่ดีที่สุดในการสร้างความมั่งคั่งระยะยาวอย่างเป็นรูปธรรม" },
      { en: "While it is true that fast food is incredibly convenient, its long-term health consequences are undeniably severe and costly.", th: "ถึงแม้ฟาสต์ฟู้ดจะสะดวกสบายสุดๆ ก็ตาม แต่ผลกระทบด้านสุขภาพในระยะยาวของมันก็รุนแรงและต้องจ่ายราคาแพงอย่างปฏิเสธไม่ได้" },
      { en: "While it is true that remote online learning offers flexibility, many younger students severely miss the traditional classroom interaction.", th: "แม้การเรียนออนไลน์ทางไกลจะให้ความยืดหยุ่น แต่เด็กนักเรียนอายุน้อยหลายคนก็ยังคงโหยหาการปฏิสัมพันธ์ในห้องเรียนแบบดั้งเดิมอย่างมาก" },
      { en: "Furthermore, the executive committee noted that the newly proposed budget does not account for unexpected future maintenance costs.", th: "นอกจากนี้ คณะกรรมการบริหารยังตั้งข้อสังเกตว่างบประมาณที่เสนอมาใหม่ไม่ได้เผื่อค่าบำรุงรักษาในอนาคตที่อาจเกิดขึ้นโดยไม่คาดคิด" },
      { en: "Furthermore, the reviewing committee noted that there is a significant lack of cultural diversity within the current executive board.", th: "ยิ่งไปกว่านั้น คณะกรรมการพิจารณาได้ชี้ให้เห็นว่ามีความบกพร่องด้านความหลากหลายทางวัฒนธรรมอย่างมีนัยสำคัญในบอร์ดบริหารชุดปัจจุบัน" },
      { en: "Furthermore, the committee noted that the current traditional marketing strategy has completely failed to reach the younger demographic.", th: "ยิ่งไปกว่านั้น คณะกรรมการตั้งข้อสังเกตว่ากลยุทธ์การตลาดแบบดั้งเดิมในปัจจุบันล้มเหลวในการเข้าถึงกลุ่มประชากรวัยรุ่นอย่างสิ้นเชิง" },
      { en: "Furthermore, the financial committee noted that immediate structural reforms are absolutely necessary to prevent any further catastrophic financial losses.", th: "นอกจากนี้ คณะกรรมการการเงินได้ชี้แจงว่าการปฏิรูปโครงสร้างอย่างเร่งด่วนเป็นสิ่งจำเป็นอย่างยิ่งเพื่อป้องกันความสูญเสียทางการเงินที่ร้ายแรงไปกว่านี้" },
      { en: "Those who argue against the new progressive tax policy claim that it will unfairly burden hard-working middle-income families.", th: "กลุ่มคนที่โต้แย้งนโยบายภาษีก้าวหน้าฉบับใหม่อ้างว่ามันจะสร้างภาระที่ไม่เป็นธรรมให้กับครอบครัวชนชั้นกลางที่ทำงานหนัก" },
      { en: "Those who argue against mandatory school uniforms believe that students should have the ultimate freedom to express themselves individually.", th: "ผู้ที่ต่อต้านการบังคับใส่เครื่องแบบนักเรียนเชื่อว่านักเรียนควรมีอิสระขั้นสูงสุดในการแสดงออกถึงความเป็นตัวตนของแต่ละคน" },
      { en: "Those who argue against nuclear power quickly point out the catastrophic long-term risks associated with radioactive waste disposal.", th: "บรรดาผู้ที่คัดค้านพลังงานนิวเคลียร์มักจะรีบชี้ให้เห็นถึงความเสี่ยงระยะยาวอันเลวร้ายที่เกี่ยวข้องกับการกำจัดกากกัมมันตรังสี" },
      { en: "Those who argue against strict internet censorship heavily emphasize the fundamental and universal human right to free speech.", th: "กลุ่มคนที่ต่อต้านการเซ็นเซอร์อินเทอร์เน็ตอย่างเข้มงวดให้ความสำคัญอย่างมากกับสิทธิมนุษยชนขั้นพื้นฐานและสากลในด้านเสรีภาพในการพูด" },
      { en: "It remains to be seen whether the newly appointed CEO can successfully turn the struggling software company around.", th: "ยังคงต้องรอดูกันต่อไปว่าซีอีโอที่เพิ่งได้รับแต่งตั้งใหม่จะสามารถกอบกู้สถานการณ์ของบริษัทซอฟต์แวร์ที่กำลังย่ำแย่ได้สำเร็จหรือไม่" },
      { en: "It remains to be seen whether the experimental medical vaccine will provide long-lasting immunity against the mutated virus.", th: "ยังต้องรอดูกันต่อไปว่าวัคซีนทางการแพทย์ที่อยู่ในการทดลองจะให้ภูมิคุ้มกันระยะยาวต่อต้านไวรัสกลายพันธุ์ได้หรือไม่" },
      { en: "It remains to be seen whether these bold governmental environmental policies will actually produce any measurable positive results.", th: "คงต้องรอดูกันต่อไปว่านโยบายสิ่งแวดล้อมที่กล้าหาญของรัฐบาลเหล่านี้จะสร้างผลลัพธ์เชิงบวกที่วัดผลได้จริงหรือไม่" },
      { en: "It remains to be seen whether the general public will peacefully accept the highly controversial changes to the national healthcare system.", th: "ยังต้องรอดูกันต่อไปว่าประชาชนทั่วไปจะยอมรับการเปลี่ยนแปลงที่เป็นที่ถกเถียงอย่างมากในระบบสาธารณสุขแห่งชาติอย่างสันติหรือไม่" },
      { en: "Consequently, many loyal consumers have completely stopped buying everyday products from brands with well-known poor environmental records.", th: "ผลลัพธ์ที่ตามมาคือ ผู้บริโภคที่เคยภักดีจำนวนมากได้หยุดซื้อสินค้าในชีวิตประจำวันจากแบรนด์ที่มีประวัติแย่ๆ ด้านสิ่งแวดล้อมอย่างสิ้นเชิง" },
      { en: "Consequently, many local consumers have strategically shifted their grocery shopping habits towards more affordable, locally sourced organic alternatives.", th: "ผลที่ตามมาก็คือ ผู้บริโภคในท้องถิ่นจำนวนมากได้ปรับเปลี่ยนพฤติกรรมการซื้อของชำอย่างมีกลยุทธ์ไปสู่ตัวเลือกออร์แกนิกในท้องถิ่นที่ราคาถูกกว่า" },
      { en: "Consequently, many furious consumers have permanently canceled their online streaming subscriptions due to the recent unjustified price increases.", th: "ผลคือ ผู้บริโภคที่โกรธจัดจำนวนมากได้ยกเลิกการเป็นสมาชิกสตรีมมิ่งออนไลน์อย่างถาวรเนื่องจากการขึ้นราคาแบบไร้เหตุผลเมื่อเร็วๆ นี้" },
      { en: "Consequently, many users have aggressively demanded greater legal transparency regarding how their sensitive personal data is being utilized.", th: "ส่งผลให้ผู้ใช้จำนวนมากออกมาเรียกร้องอย่างแข็งกร้าวให้มีความโปร่งใสทางกฎหมายที่มากขึ้นเกี่ยวกับการนำข้อมูลส่วนบุคคลที่ละเอียดอ่อนของพวกเขาไปใช้งาน" },
      { en: "Prior to the global introduction of smartphones, people traveling abroad relied heavily on cumbersome physical maps and printed travel guides.", th: "ก่อนที่จะมีการนำสมาร์ทโฟนมาใช้ทั่วโลก ผู้คนที่เดินทางไปต่างประเทศต้องพึ่งพาแผนที่กระดาษเทอะทะและคู่มือท่องเที่ยวแบบตีพิมพ์เป็นหลัก" },
      { en: "Prior to the strict introduction of modern labor laws, factory workers often endured extremely hazardous and unfair working conditions.", th: "ก่อนที่จะมีการนำกฎหมายแรงงานสมัยใหม่มาบังคับใช้อย่างเข้มงวด คนงานในโรงงานมักจะต้องทนกับสภาพการทำงานที่อันตรายและไม่เป็นธรรมอย่างยิ่ง" },
      { en: "Prior to the complete introduction of the new software system, all complicated accounting records were processed manually by tired clerks.", th: "ก่อนจะมีการนำระบบซอฟต์แวร์ใหม่มาใช้อย่างเต็มรูปแบบ บันทึกทางบัญชีที่ซับซ้อนทั้งหมดถูกจัดการด้วยมือโดยเสมียนที่เหน็ดเหนื่อย" },
      { en: "Prior to the introduction of widespread vaccination programs, many easily preventable diseases caused devastatingly high mortality rates globally.", th: "ก่อนการเริ่มโครงการฉีดวัคซีนอย่างแพร่หลาย โรคที่ป้องกันได้ง่ายหลายโรคได้ก่อให้เกิดอัตราการเสียชีวิตที่สูงจนน่าตกใจไปทั่วโลก" },

      { en: "The open-source library that we imported into our Python environment literally saved us hours of tedious programming work.", th: "ไลบรารีโอเพนซอร์สที่เราอิมพอร์ตเข้ามาในสภาพแวดล้อมไพธอน ช่วยประหยัดเวลาการเขียนโค้ดที่น่าเบื่อไปได้หลายชั่วโมงเลยทีเดียว" },
      { en: "The experienced data scientist who gave a guest lecture at Bangkok University completely changed my perspective on AI.", th: "นักวิทยาการข้อมูลมากประสบการณ์ที่มาบรรยายพิเศษที่มหาวิทยาลัยกรุงเทพ ได้เปลี่ยนมุมมองที่ฉันมีต่อ AI ไปอย่างสิ้นเชิง" },
      { en: "The API endpoint that fetches real-time financial data is currently returning an unexpected and frustrating server error.", th: "จุดเชื่อมต่อ API ที่ดึงข้อมูลการเงินแบบเรียลไทม์ ตอนนี้กำลังส่งค่าเออเรอร์จากเซิร์ฟเวอร์ที่ไม่มีใครคาดคิดและน่าหงุดหงิดกลับมา" },
      { en: "My professor told me that my data visualization charts needed to be much clearer for the final group presentation.", th: "อาจารย์บอกฉันว่ากราฟแสดงผลข้อมูลของฉันจำเป็นต้องดูให้เคลียร์กว่านี้เยอะ สำหรับการพรีเซนต์งานกลุ่มรอบไฟนอล" },
      { en: "The lead developer mentioned that we should strictly use version control when collaborating on this massive AI project.", th: "หัวหน้าทีมพัฒนาบอกไว้ว่าพวกเราควรใช้ระบบควบคุมเวอร์ชัน (Version Control) อย่างเคร่งครัดเวลาทำงานร่วมกันในโปรเจกต์ AI ยักษ์ใหญ่นี้" },
      { en: "My classmate asked if I could clearly explain the fundamental difference between supervised and unsupervised learning algorithms.", th: "เพื่อนร่วมคลาสถามฉันว่าพอจะอธิบายความแตกต่างพื้นฐานระหว่างอัลกอริทึมแบบ Supervised กับ Unsupervised ให้เคลียร์ๆ หน่อยได้ไหม" },
      { en: "The official documentation stated that the software library would no longer be supported after the end of this year.", th: "เอกสารคู่มืออย่างเป็นทางการระบุไว้ว่าซอฟต์แวร์ไลบรารีตัวนี้จะไม่ได้รับการสนับสนุนหรืออัปเดตอีกต่อไปหลังจากสิ้นปีนี้" },

      { en: "As soon as this stressful semester is finally over, I strongly plan to build a fully autonomous trading bot.", th: "ทันทีที่เทอมสุดเครียดนี้จบลงไปสักที ฉันวางแผนแน่วแน่ว่าจะเขียนบอทเทรดหุ้นอัตโนมัติแบบเต็มรูปแบบขึ้นมา" },
      { en: "Unless you properly normalize the numerical features, your machine learning model will likely produce heavily biased predictions.", th: "เว้นเสียแต่ว่าคุณจะปรับสเกลตัวเลขให้เป็นบรรทัดฐานอย่างเหมาะสม ไม่งั้นโมเดลแมชชีนเลิร์นนิงของคุณมีแนวโน้มที่จะทำนายผลออกมาแบบเอนเอียงสุดๆ" },

      { en: "Unless you handle the missing data points logically, the resulting statistical analysis will be completely meaningless and flawed.", th: "ถ้าคุณไม่จัดการกับข้อมูลที่ขาดหายไปอย่างมีตรรกะ ผลการวิเคราะห์ทางสถิติที่ออกมาก็จะไม่มีความหมายและผิดเพี้ยนไปหมด" },
      { en: "Unless I find a much more computationally efficient algorithm, this Python script will literally take several days to execute.", th: "เว้นแต่ฉันจะหาอัลกอริทึมที่ประมวลผลได้เร็วกว่านี้มากๆ ได้ สคริปต์ไพธอนตัวนี้คงกินเวลาทำงานเป็นวันๆ แน่นอน" },

      { en: "It is strictly necessary that we secure the database properly to prevent unauthorized access to sensitive user information.", th: "มันเป็นสิ่งจำเป็นอย่างเคร่งครัดที่เราต้องรักษาความปลอดภัยฐานข้อมูลให้ดี เพื่อป้องกันการเข้าถึงข้อมูลอ่อนไหวของผู้ใช้โดยไม่ได้รับอนุญาต" },

      { en: "While my complex code was compiling, I quickly checked the latest market updates on my high-growth tech stocks.", th: "ในระหว่างที่โค้ดสุดซับซ้อนของฉันกำลังคอมไพล์อยู่ ฉันก็แอบแว็บไปเช็คอัปเดตตลาดล่าสุดของหุ้นเทคเติบโตสูงในพอร์ตอย่างรวดเร็ว" },
      { en: "While the automated script was scraping data from the target website, my laptop suddenly ran out of memory.", th: "ตอนที่สคริปต์อัตโนมัติกำลังดูดข้อมูลจากเว็บไซต์เป้าหมาย จู่ๆ แรมในแล็ปท็อปของฉันก็เต็มขึ้นมากะทันหัน" },
      { en: "While we were deeply discussing the system architecture, we collectively realized that the current database schema was fundamentally flawed.", th: "ระหว่างที่พวกเรากำลังถกเถียงเรื่องสถาปัตยกรรมระบบกันอย่างลึกซึ้ง พวกเราก็ตระหนักได้พร้อมกันว่าโครงสร้างฐานข้อมูลปัจจุบันมันผิดพลาดตั้งแต่รากฐานเลย" },
      { en: "In order to significantly improve the model's accuracy, we need to gather a much larger and more diverse dataset.", th: "เพื่อที่จะพัฒนาความแม่นยำของโมเดลให้ดีขึ้นอย่างเห็นได้ชัด พวกเราต้องรวบรวมชุดข้อมูลที่ใหญ่และมีความหลากหลายมากกว่านี้เยอะ" },
      { en: "In order to become a highly successful AI engineer, you must profoundly understand both programming and advanced statistics.", th: "เพื่อที่จะก้าวไปเป็นวิศวกร AI ที่ประสบความสำเร็จขั้นสูง คุณต้องมีความเข้าใจอย่างลึกซึ้งทั้งในด้านการเขียนโปรแกรมและสถิติขั้นสูง" },
      { en: "In order to handle large-scale data processing efficiently, many modern companies are actively migrating to cloud computing platforms.", th: "เพื่อรองรับการประมวลผลข้อมูลขนาดใหญ่ได้อย่างมีประสิทธิภาพ บริษัทสมัยใหม่หลายแห่งกำลังย้ายระบบไปใช้แพลตฟอร์มคลาวด์คอมพิวติ้งอย่างตื่นตัว" },
      { en: "In order to make the portfolio dashboard highly interactive, I intentionally implemented several dynamic and responsive React components.", th: "เพื่อให้แดชบอร์ดพอร์ตโฟลิโอมีความอินเทอร์แอกทีฟสูง ฉันตั้งใจเขียนคอมโพเนนต์ React แบบไดนามิกที่ตอบสนองรวดเร็วเข้าไปหลายตัว" },
      { en: "Despite meticulously following the official documentation step by step, the software installation still mysteriously failed on my machine.", th: "ทั้งที่ทำตามคู่มืออย่างเป็นทางการแบบเป๊ะๆ ทุกขั้นตอนแล้ว แต่การติดตั้งซอฟต์แวร์บนเครื่องของฉันก็ยังคงล้มเหลวอย่างเป็นปริศนาอยู่ดี" },
      { en: "Despite the initial annoying bugs in the system, the AI chatbot performed remarkably well during the final class demonstration.", th: "ถึงแม้ระบบจะมีบั๊กกวนใจในช่วงแรกๆ แต่แชทบอท AI ก็ทำงานได้ดีอย่างน่าทึ่งตอนพรีเซนต์รอบไฟนอลในคลาส" },
      { en: "Despite having a very limited and noisy dataset, the predictive model was still able to identify some interesting hidden patterns.", th: "แม้ว่าจะมีชุดข้อมูลที่จำกัดมากและเต็มไปด้วยน้อยส์ แต่โมเดลทำนายผลก็ยังสามารถค้นพบรูปแบบที่ซ่อนอยู่ที่น่าสนใจได้บ้าง" },
      { en: "Despite his notoriously stubborn personality, he is undoubtedly one of the most brilliant programmers in our university faculty.", th: "ถึงแม้จะได้ชื่อว่าเป็นคนดื้อรั้นสุดๆ แต่เขาก็เป็นหนึ่งในโปรแกรมเมอร์ที่หัวกะทิที่สุดในคณะของมหาวิทยาลัยเราอย่างไม่ต้องสงสัย" },
      { en: "Not only did the optimized algorithm run much faster, but it also consumed significantly less memory than the previous version.", th: "อัลกอริทึมที่ถูกปรับแต่งมาใหม่ไม่เพียงแต่จะรันได้เร็วขึ้นมาก แต่มันยังกินแรมน้อยกว่าเวอร์ชันก่อนหน้าอย่างเห็นได้ชัดด้วย" },
      { en: "Not only can this advanced AI generate highly realistic images, but it can also write incredibly complex computer code.", th: "AI ขั้นสูงตัวนี้ไม่เพียงแต่จะสามารถสร้างภาพที่สมจริงสุดๆ ได้เท่านั้น แต่มันยังสามารถเขียนโค้ดคอมพิวเตอร์ที่ซับซ้อนอย่างเหลือเชื่อได้อีกด้วย" },
      { en: "Not only did we finish the demanding data science project on time, but we also received the highest grade in the class.", th: "พวกเราไม่เพียงแต่จะทำโปรเจกต์ดาต้าซายน์สุดโหดเสร็จทันเวลาเท่านั้น แต่ยังได้คะแนนสูงสุดในห้องอีกต่างหาก" },
      { en: "Not only is Python an excellent programming language for data analysis, but it is also highly versatile for backend web development.", th: "ไพธอนไม่ได้เป็นแค่ภาษาโปรแกรมที่ยอดเยี่ยมสำหรับการวิเคราะห์ข้อมูลเท่านั้น แต่มันยังอเนกประสงค์สุดๆ สำหรับการทำเว็บฝั่งแบ็คเอนด์อีกด้วย" },

      { en: "It takes months of consistent and disciplined practice to truly master the intricate concepts of machine learning algorithms.", th: "มันต้องใช้เวลาฝึกฝนอย่างสม่ำเสมอและมีวินัยเป็นเดือนๆ กว่าจะเข้าใจคอนเซปต์อันซับซ้อนของอัลกอริทึมแมชชีนเลิร์นนิงได้อย่างแท้จริง" },

      { en: "I am really looking forward to applying these advanced machine learning techniques to real-world financial data in the stock market.", th: "ฉันตั้งหน้าตั้งตารอที่จะได้นำเทคนิคแมชชีนเลิร์นนิงขั้นสูงพวกนี้ไปประยุกต์ใช้กับข้อมูลการเงินจริงๆ ในตลาดหุ้น" },
      { en: "I am genuinely looking forward to officially presenting our AI chatbot project to the university professors next week.", th: "ฉันตั้งตารอคอยที่จะได้พรีเซนต์โปรเจกต์แชทบอท AI ของพวกเราให้อาจารย์มหาลัยดูอย่างเป็นทางการในสัปดาห์หน้าจริงๆ" },
      { en: "I am incredibly looking forward to graduating and officially starting my professional career as an AI and data engineer.", th: "ฉันตั้งตารอวันที่จะได้เรียนจบและเริ่มต้นสายอาชีพวิศวกร AI และดาต้าอย่างเป็นทางการแบบสุดๆ" },
      { en: "I am looking forward to deeply exploring how artificial intelligence will eventually revolutionize space exploration in the near future.", th: "ฉันตั้งตารอที่จะได้สำรวจเจาะลึกว่าสุดท้ายแล้วปัญญาประดิษฐ์จะเข้ามาปฏิวัติวงการสำรวจอวกาศในอนาคตอันใกล้นี้ได้อย่างไร" },
      { en: "Make sure you securely back up your database before running any script that drastically alters the existing table structures.", th: "ตรวจสอบให้แน่ใจว่าคุณได้สำรองฐานข้อมูลไว้ปลอดภัยแล้ว ก่อนที่จะรันสคริปต์อะไรก็ตามที่จะเข้าไปเปลี่ยนโครงสร้างตารางเดิมขนานใหญ่" },
      { en: "Make sure the dataset is perfectly clean; otherwise, the machine learning model will just learn from incorrect or noisy data.", th: "ทำข้อมูลให้คลีนแบบเป๊ะๆ นะ ไม่งั้นโมเดลแมชชีนเลิร์นนิงก็จะได้เรียนรู้จากข้อมูลที่ผิดๆ หรือเต็มไปด้วยน้อยส์" },
      { en: "Make sure you completely understand the underlying mathematics before simply importing and using a pre-built machine learning library.", th: "จงทำความเข้าใจคณิตศาสตร์ที่อยู่เบื้องหลังให้ถ่องแท้ก่อนที่จะใช้วิธีง่ายๆ อย่างการอิมพอร์ตไลบรารีแมชชีนเลิร์นนิงสำเร็จรูปมาใช้" },
      { en: "Make sure your private API keys are securely hidden before carelessly pushing your source code to a public GitHub repository.", th: "เช็คให้ชัวร์ว่าซ่อนคีย์ API ส่วนตัวไว้ปลอดภัยแล้ว ก่อนที่จะเผลอพุชซอร์สโค้ดของคุณขึ้นบน GitHub แบบสาธารณะ" }
    ]

      { en: "I would like you to imagine a healthcare system that uses predictive modeling to accurately diagnose rare diseases before symptoms appear.", th: "ผมอยากให้ลองจินตนาการถึงระบบสาธารณสุขที่ใช้โมเดลทำนายผล เพื่อวินิจฉัยโรคหายากได้อย่างแม่นยำก่อนที่อาการจะแสดงออกมาด้วยซ้ำ" },
      { en: "Let me give you a practical example from our dataset to illustrate how this particular machine learning algorithm functions.", th: "ขออนุญาตยกตัวอย่างจริงจากชุดข้อมูลของเรา เพื่อแสดงให้เห็นภาพว่าอัลกอริทึมแมชชีนเลิร์นนิงตัวนี้มันทำงานอย่างไรนะครับ" },
      { en: "Let me give you a practical example of how a simple coding mistake can lead to a catastrophic system failure.", th: "ฉันขอยกตัวอย่างที่เป็นรูปธรรมให้ดู ว่าความผิดพลาดง่ายๆ ในการเขียนโค้ดสามารถนำไปสู่ระบบล่มครั้งใหญ่ได้อย่างไร" },
      { en: "Let me give you a practical example of why patience is absolutely required when investing in volatile high-growth technology stocks.", th: "ผมจะยกตัวอย่างจากชีวิตจริงให้ดู ว่าทำไมความอดทนจึงจำเป็นอย่างยิ่งเวลาที่เราลงทุนในหุ้นเทคโนโลยีที่เติบโตสูงและมีความผันผวน" },
      { en: "Let me give you a practical example from my daily commute to demonstrate the efficiency of this new navigation system.", th: "ฉันขอยกตัวอย่างจริงจากการเดินทางไปกลับทุกวันของฉัน เพื่อสาธิตถึงประสิทธิภาพของระบบนำทางตัวใหม่นี้ให้ดูค่ะ" },
      { en: "That is an excellent question, and I am incredibly glad you brought it up during this part of the presentation.", th: "นั่นเป็นคำถามที่ยอดเยี่ยมมากครับ และผมดีใจมากๆ ที่คุณยกประเด็นนี้ขึ้นมาในระหว่างช่วงนี้ของการพรีเซนต์พอดี" },
      { en: "That is an excellent question, and it actually leads me perfectly into the next major topic on our current agenda.", th: "เป็นคำถามที่ดีเยี่ยมเลยค่ะ และจริงๆ แล้วมันนำฉันเข้าสู่หัวข้อหลักถัดไปในวาระการประชุมของเราได้อย่างสมบูรณ์แบบเลย" },
      { en: "That is an excellent question, and the short answer is that we simply need more time to gather accurate data.", th: "เป็นคำถามที่เยี่ยมมาก และคำตอบแบบสั้นๆ ก็คือ เราแค่ต้องการเวลามากขึ้นในการรวบรวมข้อมูลที่แม่นยำครับ" },
      { en: "That is an excellent question, and if I understand you correctly, you are asking about the security of the database.", th: "นั่นเป็นคำถามที่ยอดเยี่ยมครับ และถ้าผมเข้าใจคุณถูกต้อง คุณกำลังถามเกี่ยวกับระบบรักษาความปลอดภัยของฐานข้อมูลใช่ไหมครับ?" },
      { en: "To briefly summarize what we have discussed this morning, data quality is far more important than the complexity of the algorithm.", th: "เพื่อสรุปสิ่งที่เราได้หารือกันไปเมื่อเช้านี้อย่างสั้นๆ คุณภาพของข้อมูลมีความสำคัญมากกว่าความซับซ้อนของอัลกอริทึมมากนัก" },
      { en: "To briefly summarize our main points, we strongly recommend migrating the entire legacy system to a modern cloud-based infrastructure.", th: "ขอสรุปประเด็นหลักสั้นๆ นะคะ เราขอแนะนำอย่างยิ่งให้ย้ายระบบเก่าทั้งหมดไปไว้บนโครงสร้างพื้นฐานคลาวด์ที่ทันสมัยค่ะ" },
      { en: "To briefly summarize the financial outlook, the tech sector still offers the most promising opportunities for aggressive long-term investors.", th: "เพื่อสรุปแนวโน้มทางการเงินอย่างรวบรัด ภาคเทคโนโลยียังคงมอบโอกาสที่สดใสที่สุดสำหรับนักลงทุนระยะยาวที่กล้ารับความเสี่ยงครับ" },
      { en: "To briefly summarize the project timeline, we are currently right on schedule to successfully launch the beta version next month.", th: "ขอสรุปไทม์ไลน์โปรเจกต์สั้นๆ นะครับ ตอนนี้เรากำลังดำเนินการตามกำหนดการเป๊ะๆ เพื่อที่จะเปิดตัวเวอร์ชันเบต้าให้สำเร็จในเดือนหน้า" },
      { en: "Unless we adapt to these rapidly changing technologies, our software engineering skills will eventually become completely outdated in the industry.", th: "เว้นเสียแต่ว่าเราจะปรับตัวให้เข้ากับเทคโนโลยีที่เปลี่ยนไวพวกนี้ ไม่งั้นทักษะวิศวกรรมซอฟต์แวร์ของเราก็จะล้าหลังในวงการอุตสาหกรรมในที่สุด" },
      { en: "Unless we adapt to the new market regulations quickly, the company will definitely face severe legal and financial consequences.", th: "หากเราไม่ปรับตัวให้เข้ากับกฎระเบียบใหม่ของตลาดอย่างรวดเร็ว บริษัทจะต้องเผชิญกับผลลัพธ์ทางกฎหมายและการเงินที่รุนแรงอย่างแน่นอน" },
      { en: "Unless we adapt to a more disciplined study routine, passing the upcoming advanced calculus exam will be practically impossible.", th: "ถ้าเราไม่ปรับตัวไปสู่วินัยการอ่านหนังสือที่เคร่งครัดกว่านี้ การสอบผ่านวิชาแคลคูลัสขั้นสูงรอบหน้านี้คงแทบจะเป็นไปไม่ได้เลย" },
      { en: "Unless we adapt to a healthier lifestyle and diet, we will inevitably face serious long-term medical issues in the future.", th: "เว้นแต่ว่าเราจะปรับเปลี่ยนไลฟ์สไตล์และอาหารการกินให้ดีต่อสุขภาพขึ้น ไม่งั้นเราต้องเผชิญกับปัญหาสุขภาพร้ายแรงในระยะยาวอย่างหลีกเลี่ยงไม่ได้" },
      { en: "We used to rely on traditional statistical methods, but now we exclusively utilize advanced deep learning frameworks for pattern recognition.", th: "เมื่อก่อนเราเคยพึ่งพาวิธีการทางสถิติแบบดั้งเดิม แต่ตอนนี้เราใช้เฟรมเวิร์กดีปเลิร์นนิงขั้นสูงสำหรับการจดจำรูปแบบโดยเฉพาะเท่านั้น" },
      { en: "We used to rely on manual data entry, but now our automated Python scripts handle thousands of records in mere seconds.", th: "เมื่อก่อนเราต้องพึ่งการกรอกข้อมูลด้วยมือ แต่เดี๋ยวนี้สคริปต์ไพธอนอัตโนมัติของเราสามารถจัดการข้อมูลนับพันรายการได้ในเวลาเพียงเสี้ยววินาที" },
      { en: "We used to rely on intuition when buying stocks, but now we make calculated decisions based on interactive data dashboards.", th: "เมื่อก่อนเราเคยใช้สัญชาตญาณเวลาซื้อหุ้น แต่เดี๋ยวนี้เราตัดสินใจอย่างมีการคำนวณโดยอิงจากแดชบอร์ดข้อมูลแบบอินเทอร์แอกทีฟ" },
      { en: "We used to rely on written exams, but now the university heavily focuses on practical, project-based evaluations for engineering students.", th: "เราเคยพึ่งพาแต่การสอบข้อเขียน แต่ปัจจุบันทางมหาลัยเน้นหนักไปที่การประเมินจากภาคปฏิบัติและโปรเจกต์เป็นหลักสำหรับนักศึกษาวิศวกรรม" },
      { en: "I am highly confident that this data-driven strategy will significantly improve our overall accuracy and reduce unexpected computational errors.", th: "ผมมั่นใจอย่างยิ่งว่ากลยุทธ์ที่ขับเคลื่อนด้วยข้อมูลนี้ จะช่วยเพิ่มความแม่นยำโดยรวมและลดข้อผิดพลาดในการประมวลผลที่ไม่คาดคิดลงได้อย่างมีนัยสำคัญ" },
      { en: "I am highly confident that our dedicated team can successfully overcome these technical challenges before the final project deadline.", th: "ฉันมีความมั่นใจสูงมากว่าทีมที่ทุ่มเทของเราจะสามารถเอาชนะความท้าทายทางเทคนิคเหล่านี้ได้สำเร็จก่อนเดดไลน์โปรเจกต์รอบไฟนอล" },
      { en: "I am highly confident that investing in sustainable energy solutions will yield incredible financial returns over the next two decades.", th: "ฉันมั่นใจสุดๆ ว่าการลงทุนในโซลูชันพลังงานยั่งยืนจะให้ผลตอบแทนทางการเงินที่น่าเหลือเชื่อในช่วงสองทศวรรษข้างหน้า" },
      { en: "I am highly confident that implementing this new AI feature will dramatically enhance the user experience of our web application.", th: "ผมมั่นใจอย่างสูงว่าการติดตั้งฟีเจอร์ AI ใหม่ตัวนี้ จะช่วยยกระดับประสบการณ์ผู้ใช้งานเว็ปแอปพลิเคชันของเราได้อย่างก้าวกระโดด" },
      { en: "I would like to sincerely thank everyone for your undivided attention and insightful questions during today's technical presentation.", th: "ผมขอขอบพระคุณทุกท่านอย่างใจจริง สำหรับความตั้งใจฟังและคำถามที่ลึกซึ้งในระหว่างการพรีเซนต์งานเทคนิคในวันนี้ครับ" },
      { en: "I would like to sincerely thank our university professors for their invaluable guidance throughout the development of this AI chatbot.", th: "ฉันขอขอบคุณอาจารย์มหาวิทยาลัยทุกท่านอย่างจริงใจ สำหรับคำแนะนำอันล้ำค่าตลอดช่วงการพัฒนาแชทบอท AI ตัวนี้" },
      { en: "I would like to sincerely thank my incredibly hardworking teammates for their relentless dedication to cleaning this massive dataset.", th: "ผมอยากจะขอขอบคุณเพื่อนร่วมทีมที่ทำงานหนักอย่างน่าเหลือเชื่อ สำหรับความทุ่มเทอย่างไม่ลดละในการคลีนข้อมูลชุดใหญ่โตนี้" },
      { en: "I would like to sincerely thank the board of directors for giving me this wonderful opportunity to share my analysis today.", th: "ฉันขอขอบพระคุณคณะกรรมการบริหารอย่างจริงใจ ที่มอบโอกาสอันยอดเยี่ยมให้ฉันได้มาแบ่งปันบทวิเคราะห์ในวันนี้ค่ะ" }
    ]
  },

      { en: "Could you please review the attached Python script when you have a moment, as I value your technical expertise?", th: "รบกวนช่วยตรวจทานสคริปต์ไพธอนที่แนบมานี้ตอนที่คุณพอมีเวลาได้ไหมครับ เพราะผมให้ความสำคัญกับความเชี่ยวชาญด้านเทคนิคของคุณมาก" },

      { en: "Could you please review the updated database schema to ensure it meets the company's strict security and performance standards?", th: "รบกวนช่วยรีวิวโครงสร้างฐานข้อมูลที่อัปเดตใหม่ เพื่อให้มั่นใจว่ามันตรงตามมาตรฐานความปลอดภัยและประสิทธิภาพที่เข้มงวดของบริษัทได้ไหมครับ?" },
      { en: "Could you please review my proposed presentation slides for the upcoming AI conference by the end of this week?", th: "รบกวนช่วยตรวจทานสไลด์พรีเซนต์ที่ดิฉันเสนอ สำหรับงานคอนเฟอเรนซ์ด้าน AI ที่กำลังจะมาถึง ภายในสิ้นสัปดาห์นี้ได้ไหมคะ?" },
      { en: "Based on my recent analysis of the user data, I strongly recommend implementing a more intuitive dashboard interface.", th: "จากการวิเคราะห์ข้อมูลผู้ใช้เมื่อเร็วๆ นี้ของผม ผมขอแนะนำอย่างยิ่งให้ทำหน้าจอแดชบอร์ดที่ใช้งานได้สัญชาตญาณมากขึ้นครับ" },
      { en: "Based on my recent analysis of the tech market trends, it would be highly beneficial to diversify our portfolio immediately.", th: "จากการวิเคราะห์เทรนด์ตลาดเทคโนโลยีล่าสุดของฉัน มันจะเป็นประโยชน์อย่างมากที่จะกระจายพอร์ตการลงทุนของเราในทันทีค่ะ" },
      { en: "Based on my recent analysis of the chatbot's performance, we definitely need to gather a wider variety of training data.", th: "อ้างอิงจากการวิเคราะห์ประสิทธิภาพของแชทบอทล่าสุด เราจำเป็นต้องรวบรวมข้อมูลสำหรับเทรนให้มีความหลากหลายมากกว่านี้อย่างแน่นอนครับ" },
      { en: "Based on my recent analysis of our daily server logs, the sudden system crashes are directly caused by memory leaks.", th: "จากการวิเคราะห์ล็อกเซิร์ฟเวอร์รายวันของดิฉัน ระบบที่พังลงอย่างกะทันหันมีสาเหตุโดยตรงมาจากปัญหาหน่วยความจำรั่วไหลค่ะ" },
      { en: "I would greatly appreciate it if you could clarify the specific requirements for the upcoming advanced machine learning assignment.", th: "ผมจะรู้สึกขอบคุณเป็นอย่างยิ่งหากอาจารย์ช่วยขยายความข้อกำหนดเฉพาะสำหรับงานแมชชีนเลิร์นนิงขั้นสูงที่กำลังจะมาถึงนี้ให้ชัดเจนขึ้นครับ" },
      { en: "I would greatly appreciate it if you could provide some constructive feedback on my latest data visualization charts.", th: "ฉันจะขอบคุณมากหากคุณสามารถให้ข้อเสนอแนะเชิงสร้างสรรค์เกี่ยวกับกราฟแสดงข้อมูลล่าสุดของฉันได้ค่ะ" },
      { en: "I would greatly appreciate it if you could approve the budget for upgrading our outdated cloud storage infrastructure soon.", th: "ผมจะซาบซึ้งใจมากหากคุณช่วยอนุมัติงบประมาณสำหรับการอัปเกรดโครงสร้างพื้นฐานคลาวด์สตอเรจที่ล้าสมัยของเราในเร็วๆ นี้ครับ" },

      { en: "Despite our diligent efforts to resolve the critical software bug, the system still occasionally crashes during heavy user traffic.", th: "แม้ว่าพวกเราจะพยายามอย่างเต็มที่เพื่อแก้ไขบั๊กซอฟต์แวร์ที่วิกฤตนี้ แต่ระบบก็ยังคงล่มเป็นบางครั้งในช่วงที่มีผู้ใช้งานหนาแน่นครับ" },
      { en: "Despite our diligent efforts to clean the massive dataset, there are still some unavoidable inconsistencies in the historical records.", th: "แม้เราจะทุ่มเทความพยายามในการคลีนชุดข้อมูลขนาดใหญ่ แต่ก็ยังคงมีความไม่สอดคล้องกันที่หลีกเลี่ยงไม่ได้บางจุดในบันทึกข้อมูลย้อนหลังค่ะ" },
      { en: "Despite our diligent efforts to optimize the algorithmic logic, the deep learning model requires significantly more processing time than expected.", th: "ถึงแม้เราจะพยายามปรับแต่งตรรกะของอัลกอริทึมอย่างขยันขันแข็ง แต่โมเดลดีปเลิร์นนิงก็ยังต้องใช้เวลาประมวลผลมากกว่าที่คาดไว้มากครับ" },
      { en: "Despite our diligent efforts to secure the necessary funding, the tech startup unfortunately decided to delay its ambitious expansion.", th: "แม้จะใช้ความพยายามอย่างมากในการจัดหาเงินทุนที่จำเป็น แต่น่าเสียดายที่สตาร์ทอัพเทคตัดสินใจเลื่อนแผนขยายธุรกิจอันทะเยอทะยานออกไปค่ะ" },
      { en: "Please find attached the comprehensive analytical report detailing the quarterly performance of our high-growth technology stock investments.", th: "โปรดดูรายงานการวิเคราะห์เชิงลึกที่แนบมา ซึ่งแจกแจงรายละเอียดผลประกอบการรายไตรมาสของการลงทุนในหุ้นเทคโนโลยีที่เติบโตสูงของเราครับ" },
      { en: "Please find attached the revised source code for the university project, which includes all the requested architectural improvements.", th: "โปรดดูซอร์สโค้ดสำหรับโปรเจกต์มหาวิทยาลัยฉบับแก้ไขที่แนบมา ซึ่งรวมถึงการปรับปรุงโครงสร้างสถาปัตยกรรมทั้งหมดตามที่ร้องขอแล้วค่ะ" },
      { en: "Please find attached the official meeting minutes summarizing our detailed discussion regarding the new artificial intelligence implementation strategy.", th: "โปรดตรวจสอบรายงานการประชุมอย่างเป็นทางการที่แนบมา ซึ่งสรุปการหารือโดยละเอียดของเราเกี่ยวกับกลยุทธ์การติดตั้งปัญญาประดิษฐ์ระบบใหม่ครับ" },

      { en: "If we decide to proceed with this highly risky tech investment, we must strictly monitor the market volatility every day.", th: "หากเราตัดสินใจที่จะดำเนินการลงทุนสายเทคที่มีความเสี่ยงสูงนี้ต่อไป เราจะต้องเฝ้าระวังความผันผวนของตลาดอย่างเข้มงวดทุกวันครับ" },
      { en: "If we decide to proceed with deploying the untested chatbot version, we will likely face severe complaints from our clients.", th: "ถ้าเราตัดสินใจเดินหน้าปล่อยแชทบอทเวอร์ชันที่ยังไม่ได้ทดสอบขึ้นระบบ เรามีแนวโน้มที่จะต้องเผชิญกับคำร้องเรียนอย่างหนักจากลูกค้าค่ะ" },
      { en: "If we decide to proceed with upgrading the main server, the entire system will be temporarily offline for several hours.", th: "หากเราตัดสินใจที่จะดำเนินการอัปเกรดเซิร์ฟเวอร์หลัก ระบบทั้งหมดจะออฟไลน์ชั่วคราวเป็นเวลาหลายชั่วโมงครับ" },
      { en: "If we decide to proceed with this new data architecture, I will need to rewrite a significant portion of the backend code.", th: "ถ้าเราตกลงที่จะใช้สถาปัตยกรรมข้อมูลแบบใหม่นี้ ฉันจะจำเป็นต้องเขียนโค้ดฝั่งแบ็คเอนด์ใหม่เป็นจำนวนมากค่ะ" },
      { en: "I completely understand your concerns regarding the project's tight deadline, but I assure you we are working diligently.", th: "ผมเข้าใจถึงความกังวลของคุณเกี่ยวกับเดดไลน์โปรเจกต์ที่กระชั้นชิดอย่างเต็มที่ แต่ผมขอรับรองว่าเรากำลังทำงานอย่างขยันขันแข็งครับ" },
      { en: "I completely understand your concerns regarding the high cost of the new GPU, but it is absolutely necessary for training the AI.", th: "ดิฉันเข้าใจความกังวลของคุณเรื่องราคาที่สูงลิ่วของการ์ดจอใหม่เป็นอย่างดี แต่มันจำเป็นอย่างยิ่งยวดสำหรับการเทรน AI ค่ะ" },
      { en: "I completely understand your concerns regarding the data privacy issues, which is exactly why we implemented strict encryption protocols.", th: "ผมเข้าใจข้อกังวลของคุณเรื่องปัญหาความเป็นส่วนตัวของข้อมูลครับ ซึ่งนั่นเป็นเหตุผลพอดีเลยที่เราได้นำโปรโตคอลการเข้ารหัสที่เข้มงวดมาใช้" },
      { en: "I completely understand your concerns regarding the stock's recent volatility, though I still believe in its long-term fundamental value.", th: "ฉันเข้าใจความกังวลของคุณเกี่ยวกับความผันผวนล่าสุดของหุ้นตัวนี้ แม้ว่าฉันจะยังคงเชื่อมั่นในมูลค่าพื้นฐานระยะยาวของมันก็ตามค่ะ" },
      { en: "It has come to my attention that several automated Python scripts are failing due to an unexpected change in the API.", th: "ผมได้รับทราบมาว่าสคริปต์ไพธอนอัตโนมัติหลายตัวกำลังทำงานล้มเหลว เนื่องจากการเปลี่ยนแปลงที่ไม่คาดคิดในระบบ API ครับ" },

      { en: "It has come to my attention that some team members are struggling to understand the complex logic behind the new algorithm.", th: "ผมเพิ่งทราบมาว่าสมาชิกในทีมบางคนกำลังประสบปัญหาในการทำความเข้าใจตรรกะที่ซับซ้อนเบื้องหลังอัลกอริทึมตัวใหม่ครับ" },
      { en: "It has come to my attention that our current cloud storage plan will exceed its maximum data limit by next week.", th: "ดิฉันได้รับรายงานว่าแพลนพื้นที่เก็บข้อมูลบนคลาวด์ปัจจุบันของเรา จะใช้ข้อมูลเกินขีดจำกัดสูงสุดภายในสัปดาห์หน้าค่ะ" },
      { en: "In order to ensure that the final presentation runs smoothly, I suggest we schedule a full rehearsal tomorrow afternoon.", th: "เพื่อให้มั่นใจว่าการพรีเซนต์รอบไฟนอลจะดำเนินไปอย่างราบรื่น ผมขอเสนอให้เรานัดซ้อมใหญ่กันในบ่ายวันพรุ่งนี้ครับ" },
      { en: "In order to ensure that the dataset is completely free of errors, I will write a custom validation script tonight.", th: "เพื่อให้แน่ใจว่าชุดข้อมูลนั้นปราศจากข้อผิดพลาดโดยสมบูรณ์ ฉันจะเขียนสคริปต์สำหรับตรวจสอบความถูกต้องแบบปรับแต่งเองในคืนนี้ค่ะ" },
      { en: "In order to ensure that our investment portfolio remains balanced, we should carefully reevaluate our tech stock holdings this quarter.", th: "เพื่อให้พอร์ตการลงทุนของเรายังคงสมดุล เราควรประเมินการถือครองหุ้นเทคโนโลยีของเราใหม่อย่างรอบคอบในไตรมาสนี้ครับ" },
      { en: "In order to ensure that the new employees understand the workflow, I have prepared a detailed technical documentation guide.", th: "เพื่อสร้างความมั่นใจว่าพนักงานใหม่จะเข้าใจระบบการทำงาน ดิฉันได้จัดเตรียมคู่มือเอกสารทางเทคนิคที่มีรายละเอียดครบถ้วนไว้แล้วค่ะ" },
      { en: "I would like to suggest that we temporarily suspend the server migration until we have thoroughly backed up all databases.", th: "ผมขอเสนอแนะให้เราระงับการย้ายเซิร์ฟเวอร์ไว้ชั่วคราว จนกว่าพวกเราจะทำการสำรองฐานข้อมูลทั้งหมดอย่างถี่ถ้วนเสียก่อนครับ" },
      { en: "I would like to suggest that we invite a guest speaker from the data science industry to our next university seminar.", th: "ดิฉันอยากจะเสนอให้เราเชิญวิทยากรรับเชิญจากแวดวงวิทยาการข้อมูล มาบรรยายในงานสัมมนาของมหาวิทยาลัยครั้งหน้าค่ะ" },
      { en: "I would like to suggest that we implement a more rigorous code review process to prevent future bugs from reaching production.", th: "ผมขอเสนอให้เรานำกระบวนการตรวจทานโค้ดที่เข้มงวดกว่าเดิมมาใช้ เพื่อป้องกันไม่ให้บั๊กหลุดไปถึงระบบจริงในอนาคตครับ" },
      { en: "I would like to suggest that we organize a brief weekly meeting to align our individual progress on the AI project.", th: "ฉันขอเสนอให้เราจัดการประชุมสั้นๆ ทุกสัปดาห์ เพื่อปรับความเข้าใจให้ตรงกันเรื่องความคืบหน้าของแต่ละคนในโปรเจกต์ AI ค่ะ" },
      { en: "As discussed in our previous meeting, I will immediately begin rewriting the core logic for the data preprocessing module.", th: "ตามที่ได้หารือกันในการประชุมครั้งก่อน ผมจะเริ่มลงมือเขียนตรรกะหลักสำหรับโมดูลเตรียมการข้อมูลใหม่ในทันทีครับ" },
      { en: "As discussed in our previous meeting, I will carefully monitor the performance of the newly deployed machine learning algorithm.", th: "ตามที่เราคุยกันในการประชุมก่อนหน้านี้ ดิฉันจะเฝ้าติดตามประสิทธิภาพของอัลกอริทึมแมชชีนเลิร์นนิงที่เพิ่งนำขึ้นระบบอย่างระมัดระวังค่ะ" },
      { en: "As discussed in our previous meeting, I will draft a formal email to the clients explaining the sudden technical delay.", th: "อ้างอิงจากการประชุมครั้งก่อน ผมจะร่างอีเมลแบบเป็นทางการส่งถึงลูกค้าเพื่อชี้แจงถึงความล่าช้าทางเทคนิคที่เกิดขึ้นกะทันหันครับ" },
      { en: "As discussed in our previous meeting, I will research alternative cloud computing platforms to significantly reduce our monthly operational costs.", th: "ตามที่หารือกันไว้ ฉันจะไปค้นคว้ารีเสิร์ชแพลตฟอร์มคลาวด์ทางเลือกอื่นๆ เพื่อช่วยลดต้นทุนการดำเนินงานรายเดือนของเราลงอย่างเป็นกอบเป็นกำค่ะ" },
      { en: "We must carefully consider the fact that rushing the software deployment could lead to catastrophic security vulnerabilities.", th: "เราต้องพิจารณาความจริงอย่างรอบคอบว่า การเร่งนำซอฟต์แวร์ขึ้นระบบอาจนำไปสู่ช่องโหว่ด้านความปลอดภัยที่ร้ายแรงได้ครับ" },
      { en: "We must carefully consider the fact that artificial intelligence heavily relies on the quality and diversity of the training data.", th: "เราจำต้องพิจารณาข้อเท็จจริงที่ว่า ปัญญาประดิษฐ์นั้นต้องพึ่งพาคุณภาพและความหลากหลายของข้อมูลสำหรับเทรนอย่างมหาศาลค่ะ" },
      { en: "We must carefully consider the fact that investing a massive amount of capital in a single tech startup is highly risky.", th: "พวกเราต้องไตร่ตรองข้อเท็จจริงนี้อย่างระมัดระวัง ว่าการลงทุนด้วยเงินทุนมหาศาลในสตาร์ทอัพเทคโนโลยีเพียงแห่งเดียวนั้นมีความเสี่ยงสูงมากครับ" },
      { en: "We must carefully consider the fact that my daily commute by motorcycle is heavily affected by the unpredictable rainy weather.", th: "เราต้องพิจารณาเรื่องนี้ดีๆ ว่าการเดินทางไปทำงานด้วยมอเตอร์ไซค์ในทุกๆ วันของฉัน มันได้รับผลกระทบอย่างหนักจากสภาพอากาศฝนตกที่คาดเดาไม่ได้เลย" },
      { en: "I sincerely apologize for any inconvenience caused by the unexpected delay in submitting my final data science assignment.", th: "ผมต้องขออภัยอย่างจริงใจสำหรับความไม่สะดวกที่เกิดจากความล่าช้าโดยไม่คาดคิด ในการส่งงานวิชาดาต้าซายน์ชิ้นสุดท้ายของผมครับ" },
      { en: "I sincerely apologize for any inconvenience caused by the temporary unavailability of the interactive portfolio dashboard this morning.", th: "ดิฉันขออภัยอย่างสุดซึ้งสำหรับความไม่สะดวกใดๆ ที่เกิดจากการที่แดชบอร์ดพอร์ตโฟลิโออินเทอร์แอกทีฟไม่สามารถใช้งานได้ชั่วคราวเมื่อเช้านี้ค่ะ" },
      { en: "I sincerely apologize for any inconvenience caused by my late arrival to the morning meeting due to terrible traffic.", th: "ผมขออภัยอย่างยิ่งสำหรับความไม่สะดวกจากการที่ผมมาถึงที่ประชุมช่วงเช้าสาย อันเนื่องมาจากการจราจรที่ติดขัดอย่างหนักครับ" },
      { en: "I sincerely apologize for any inconvenience caused by the formatting errors present in the initial version of the quarterly report.", th: "ดิฉันขออภัยอย่างจริงใจต่อความไม่สะดวกที่เกิดจากข้อผิดพลาดในการจัดรูปแบบ ซึ่งปรากฏในรายงานประจำไตรมาสเวอร์ชันแรกค่ะ" },

      { en: "Unless we receive formal approval from the executive board, the proposed budget for the new AI project will be frozen.", th: "หากเราไม่ได้รับการอนุมัติอย่างเป็นทางการจากบอร์ดบริหาร งบประมาณที่เสนอไปสำหรับโปรเจกต์ AI ตัวใหม่นี้ก็จะถูกระงับไว้ค่ะ" },
      { en: "Unless we receive formal approval from the lead software engineer, we should not merge these major changes into the main branch.", th: "เว้นแต่จะได้รับการอนุมัติเป็นลายลักษณ์อักษรจากหัวหน้าวิศวกรซอฟต์แวร์ เราไม่ควรนำการเปลี่ยนแปลงครั้งใหญ่นี้ไปรวมเข้ากับโค้ดหลักครับ" },
      { en: "Unless we receive formal approval from the compliance team, we cannot officially launch the new automated trading feature.", th: "ถ้าเรายังไม่ได้รับไฟเขียวอย่างเป็นทางการจากทีมกำกับดูแล เราก็ไม่สามารถเปิดตัวฟีเจอร์เทรดอัตโนมัติตัวใหม่อย่างเป็นทางการได้ค่ะ" },
      { en: "I am confident that my strong background in AI engineering makes me a highly suitable candidate for this data scientist position.", th: "ผมมั่นใจว่าพื้นฐานที่แข็งแกร่งด้านวิศวกรรม AI ทำให้ผมเป็นผู้สมัครที่เหมาะสมอย่างยิ่งสำหรับตำแหน่งนักวิทยาการข้อมูลนี้ครับ" },

<script type="text/babel">

// =====================================
// FILE CONTENT: shared.js
// =====================================
// ==========================================
// 🌟 SHARED UTILITIES & PREMIUM COMPONENTS
// ==========================================
window.Utils = {
    shuffleArray: (array) => {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    },
    
    // Anki-like Supervised SRS Algorithm
    calculateSRS: (cardData, rating) => {
        let { interval = 0, ease = 2.5, step = 0 } = cardData || {};
        if (rating === 'again') { 
            step = 0; 
            interval = 0; 
            ease = Math.max(1.3, ease - 0.2); 
        } else if (rating === 'hard') { 
            if (step === 0) { 
                interval = 1; 
                step = 1; 
            } else { 
                interval = Math.max(1, Math.round(interval * 1.2)); 
                ease = Math.max(1.3, ease - 0.15); 
            } 
        } else if (rating === 'good') { 
            if (step === 0) { 
                interval = 4; 
                step = 1; 
            } else { 
                interval = Math.max(1, Math.round(interval * ease)); 
            } 
        } else if (rating === 'easy') { 
            if (step === 0) { 
                interval = 7; 
                step = 1; 
            } else { 
                ease += 0.15; 
                interval = Math.max(7, Math.round(interval * ease * 1.3)); 
            } 
        }
        const nextDate = new Date();
        if (interval > 0) {
            nextDate.setDate(nextDate.getDate() + interval);
            nextDate.setHours(4, 0, 0, 0); // รีเซ็ตการสอบทบทวนตอนตี 4 ของวันตามระบบสากลของ Anki
        } else {
            nextDate.setMinutes(nextDate.getMinutes() + 10); // ถ้า Again จะกลับมาในอีก 10 นาที (ตามมาตรฐาน Anki)
        }
        return { interval, ease, step, nextReview: nextDate.getTime() };
    },

    // แบ่งคำประโยคอัจฉริยะ (Smart Sentence Chunking)
    smartChunk: (text) => {
        const words = text.split(' '); 
        const chunks = []; 
        let current = [];
        const breakWords = new Set(['and', 'but', 'or', 'so', 'because', 'to', 'for', 'with', 'in', 'on', 'at', 'about', 'which', 'that', 'who', 'when', 'where', 'while']);
        
        words.forEach((word) => {
            const cleanWord = word.toLowerCase().replace(/[^a-z]/g, '');
            if (breakWords.has(cleanWord) && current.length > 0) { 
                chunks.push(current.join(' ')); 
                current = [word]; 
            } else { 
                current.push(word); 
                if (word.match(/[.,!?:]$/)) { 
                    chunks.push(current.join(' ')); 
                    current = []; 
                } 
            }
        });
        if (current.length > 0) chunks.push(current.join(' '));
        return chunks.filter(c => c.trim().length > 0);
    },

    // ป้องกันคลื่นเสียงชนกันพร้อมค้นหาเสียงพรีเมียมเสมือนมนุษย์ (Premium Human-Like Speech Engine)
    speak: (text, lang = 'en-US', speed = 1.0) => {
        try {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // ตัดเสียงเก่าก่อนพูดใหม่ทันที
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; 
            utterance.rate = speed;
            
            const voices = window.speechSynthesis.getVoices();
            if (voices && voices.length > 0) {
                // กรองเสียงตามตระกูลภาษาหลัก (เช่น en หรือ th)
                const targetLangShort = lang.split('-')[0].toLowerCase();
                const matchedVoices = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(targetLangShort));
                
                if (matchedVoices.length > 0) {
                    // จัดอันดับค้นหาเสียงมนุษย์ที่พรีเมียมที่สุด
                    let selectedVoice = null;
                    
                    // 1. ลองค้นหาเสียงระบุ Premium หรือ Natural
                    selectedVoice = matchedVoices.find(v => {
                        const nameLower = v.name.toLowerCase();
                        return nameLower.includes('premium') || nameLower.includes('natural');
                    });
                    
                    // 2. ลองค้นหาเสียง Google (คุณภาพสุดยอดและมีความเป็นธรรมชาติสูงมากบน Android/Chrome)
                    if (!selectedVoice) {
                        selectedVoice = matchedVoices.find(v => v.name.toLowerCase().includes('google'));
                    }
                    
                    // 3. ลองค้นหาเสียง Apple หรือเสียงยอดนิยมในมือถือ/คอม (Samantha, Karen, Moira, Tessa, Zira, Hazel)
                    if (!selectedVoice) {
                        const popularNames = ['samantha', 'karen', 'moira', 'tessa', 'zira', 'hazel', 'daniel', 'apple'];
                        selectedVoice = matchedVoices.find(v => {
                            const nameLower = v.name.toLowerCase();
                            return popularNames.some(p => nameLower.includes(p));
                        });
                    }
                    
                    // 4. Fallback: เอาเสียงแรกของระบบในภาษานั้น
                    if (!selectedVoice) {
                        selectedVoice = matchedVoices[0];
                    }
                    
                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    }
                }
            }
            
            window.speechSynthesis.speak(utterance);
        } catch (e) { 
            console.warn("Audio error", e); 
        }
    }
};

    }
}

window.ESB_Features = window.ESB_Features || {};

// ⭐️ เปลี่ยนมารับค่า srsData และ dueCardsCount แทน reviewHistory
window.MonthlyCalendarModal = ({ srsData = {}, dueCardsCount = 0, onClose }) => {
    const { useState, useMemo } = React;
    const [viewDate, setViewDate] = useState(new Date());
    
    const prevMonth = () => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1));
    const nextMonth = () => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1));
    
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const monthName = viewDate.toLocaleString('en-US', { month: 'short' }); 
    
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();
    
    const blanks = Array(firstDay).fill(null);
    const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
    const weekDays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

    // ⭐️ คำนวณพยากรณ์การ์ดในอนาคต (Forecast) จาก srsData
    const futureDueMap = useMemo(() => {
        const map = {};
        const today = new Date();
        today.setHours(0,0,0,0);
        
        Object.values(srsData).forEach(card => {
            if (card.nextReview) {
                const reviewDate = new Date(card.nextReview);
                reviewDate.setHours(0,0,0,0);
                if (reviewDate.getTime() > today.getTime()) {
                    const key = `${reviewDate.getFullYear()}-${String(reviewDate.getMonth() + 1).padStart(2, '0')}-${String(reviewDate.getDate()).padStart(2, '0')}`;
                    map[key] = (map[key] || 0) + 1;
                }
            }
        });
        return map;
    }, [srsData]);

    const today = new Date();
    today.setHours(0,0,0,0);

    return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy-900/80 backdrop-blur-md animate-fade-in" onClick={onClose}>
            <div className="bg-[#151F32] w-full max-w-[320px] rounded-[2rem] p-6 border border-brand-yellow/30 shadow-[0_0_40px_rgba(250,204,21,0.15)] relative" onClick={e => e.stopPropagation()}>
                
                <div className="flex justify-center mb-4">
                    <div className="w-12 h-12 rounded-full border border-white/10 bg-[#1E293B] flex items-center justify-center text-xl shadow-inner">🗓️</div>
                </div>

                <div className="flex justify-between items-center mb-6 mt-2">
                    <button onClick={prevMonth} className="p-2 text-slate-400 hover:text-brand-yellow transition-colors font-bold text-lg">&lt;</button>
                    <h3 className="text-lg font-bold text-white tracking-widest uppercase">{monthName} <span className="text-brand-yellow">{year}</span></h3>
                    <button onClick={nextMonth} className="p-2 text-slate-400 hover:text-brand-yellow transition-colors font-bold text-lg">&gt;</button>
                </div>

                <div className="grid grid-cols-7 gap-2 mb-3 border-b border-white/5 pb-2">
                    {weekDays.map((d, i) => <div key={i} className="text-[10px] font-bold text-slate-500 text-center">{d}</div>)}
                </div>

                <div className="grid grid-cols-7 gap-2 mb-6">
                    {blanks.map((_, i) => <div key={`blank-${i}`} className="aspect-square"></div>)}
                    {days.map(day => {
                        const cellDate = new Date(year, month, day);
                        cellDate.setHours(0,0,0,0);
                        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        
                        let count = 0;
                        let isPast = cellDate.getTime() < today.getTime();
                        let isToday = cellDate.getTime() === today.getTime();

                        // ⭐️ ดึงยอดการ์ดที่ค้างอยู่ (Due)
                        if (isToday) {
                            count = dueCardsCount; // วันนี้เอายอดจริงๆ มาโชว์
                        } else if (!isPast) {
                            count = futureDueMap[dateKey] || 0; // อนาคตเอายอดพยากรณ์มาโชว์
                        }

                        // จัดสีให้ดูง่าย
                        let styleClass = "bg-[#0B1121] text-slate-600 border border-white/5";
                        if (isPast) {
                            styleClass = "bg-transparent text-slate-700 opacity-50"; // วันในอดีต (จางลง)
                        } else if (isToday) {
                            styleClass = "bg-navy-800 text-white border-2 border-brand-yellow shadow-[0_0_10px_rgba(250,204,21,0.2)]"; // วันนี้ (กรอบเหลือง)
                        } else if (count > 0) {
                            styleClass = "bg-navy-800 border border-navy-600 text-slate-300"; // วันที่มีการ์ดรอทวน
                        }

                        return (
                            <div key={day} className={`aspect-square rounded-xl flex flex-col items-center justify-center transition-all ${styleClass}`}>
                                <span className={`text-[12px] font-semibold leading-none ${isToday ? 'text-brand-yellow' : ''}`}>{day}</span>
                                {/* โชว์ตัวเลขการ์ด (เฉพาะวันนี้และอนาคต) */}
                                {!isPast && (
                                    <span className={`text-[8px] mt-0.5 leading-none tracking-tighter ${count > 0 ? (isToday ? 'text-brand-yellow' : 'text-slate-400') : 'text-slate-600'}`}>
                                        {count > 0 ? count : '-'}
                                    </span>
                                )}
                            </div>
                        );
                    })}
                </div>

                <button onClick={onClose} className="w-full bg-gradient-to-r from-yellow-400 to-amber-500 text-[#0B1121] py-4 rounded-xl font-bold text-sm shadow-[0_5px_15px_rgba(250,204,21,0.3)] active:scale-95 transition-all">
                    รับทราบ
                </button>
            </div>
        </div>
    );
};

window.ESB_Features.UpcomingReviews = ({ srsData, dueCardsCount }) => {
    const { useMemo, useState } = React;
    const [showCalendar, setShowCalendar] = useState(false);

    const handleViewMonthClick = () => {
        setShowCalendar(true);
    };

    const upcomingDays = useMemo(() => {
        const days = [];
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        days.push({
            label: 'Today',
            date: today.getDate(),
            count: dueCardsCount,
            isToday: true
        });

        for (let i = 1; i <= 4; i++) {
            const nextDate = new Date(today);
            nextDate.setDate(today.getDate() + i);
            
            const startOfDay = nextDate.getTime();
            const endOfDay = startOfDay + (24 * 60 * 60 * 1000) - 1;
            
            let count = 0;
            Object.values(srsData).forEach(card => {
                if (card.nextReview >= startOfDay && card.nextReview <= endOfDay) {
                    count++;
                }
            });

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.push({
                label: dayNames[nextDate.getDay()],
                date: nextDate.getDate(),
                count: count,
                isToday: false
            });
        }
        return days;
    }, [srsData, dueCardsCount]);

    return (
        <div className="relative">
            <div className="flex justify-between items-end mb-3 mt-4">
                <h3 className="text-sm font-bold text-white text-[13px] tracking-wide">Upcoming Reviews</h3>
                <button 
                    onClick={handleViewMonthClick} 
                    className="text-xs font-semibold text-brand-yellow hover:text-yellow-400 transition-colors"
                >
                    View Month
                </button>
            </div>

            <div className="flex gap-3 overflow-x-auto pb-2" style={{ scrollbarWidth: 'none' }}>
                {upcomingDays.map((day, idx) => (
                    <div key={idx} className={`rounded-xl p-3 min-w-[75px] text-center transition-all ${day.isToday ? 'bg-navy-800 border-2 border-brand-yellow shadow-[0_0_10px_rgba(250,204,21,0.2)]' : 'bg-navy-800 border border-navy-700 opacity-80'}`}>
                        <div className={`text-[10px] font-bold uppercase ${day.isToday ? 'text-brand-yellow' : 'text-slate-500'}`}>{day.label}</div>
                        <div className="text-xl font-bold text-white my-1">{day.date}</div>
                        {day.isToday ? (
                            <div className="flex justify-center gap-1">
                                <span className="w-1 h-1 bg-brand-yellow rounded-full"></span>
                                <span className="w-1 h-1 bg-brand-yellow rounded-full"></span>
                            </div>
                        ) : (
                            <div className="text-[9px] text-slate-500">{day.count} cards</div>
                        )}
                    </div>
                ))}
            </div>

            {/* ⭐️ ส่ง srsData และ dueCardsCount ไปให้ปฏิทิน */}
            {showCalendar && (
                <window.MonthlyCalendarModal 
                    srsData={srsData} 
                    dueCardsCount={dueCardsCount} 
                    onClose={() => setShowCalendar(false)} 
                />
            )}
        </div>
    );
};

window.ESB_Features.RetentionChart = ({ reviewHistory }) => {
    const { useMemo } = React;

    const chartData = useMemo(() => {
        const data = [];
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const dayOfWeek = today.getDay(); 
        const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        
        const startOfWeek = new Date(today);
        startOfWeek.setDate(today.getDate() + diffToMonday);

        let totalCorrect = 0;
        let totalReviewed = 0;
        const fixedLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

        for (let i = 0; i < 7; i++) {
            const d = new Date(startOfWeek);
            d.setDate(startOfWeek.getDate() + i);
            
            const dateKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            const historyObj = reviewHistory[dateKey] || { correct: 0, total: 0 };
            
            // คำนวณเปอร์เซ็นต์ความจำของแต่ละวัน
            const retentionStr = historyObj.total > 0 ? Math.round((historyObj.correct / historyObj.total) * 100) : 0;
            
            totalCorrect += historyObj.correct;
            totalReviewed += historyObj.total;

            data.push({
                dayLabel: fixedLabels[i],
                retention: retentionStr,
                isToday: d.getTime() === today.getTime(),
                hasData: historyObj.total > 0,
                isFuture: d.getTime() > today.getTime()
            });
        }

        const avgRetention = totalReviewed > 0 ? Math.round((totalCorrect / totalReviewed) * 100) : 0;
        return { data, avgRetention };
    }, [reviewHistory]);

    return (
        <div className="bg-gradient-to-b from-navy-800 to-[#10172A] p-6 rounded-[2rem] border border-white/5 shadow-xl mt-6 mb-8 relative overflow-hidden">
            {/* แสงเรืองแสงมุมขวาบน */}
            <div className="absolute top-0 right-0 w-32 h-32 bg-brand-yellow/5 blur-3xl rounded-full pointer-events-none"></div>
            
            <div className="flex justify-between items-end mb-8 relative z-10">
                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Retention Rate</h3>
                <span className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-yellow-500 leading-none">{chartData.avgRetention}%</span>
            </div>
            
            {/* ⭐️ โครงสร้างกราฟใหม่ที่บังคับให้แท่งยืดขึ้นตาม % แน่นอน */}
            <div className="flex items-end justify-between h-40 gap-2 pb-2 relative z-10 border-b border-navy-700/50">
                {chartData.data.map((item, idx) => {
                    // กำหนดความสูง: ถ้ามีข้อมูลเอาตาม % จริง (ขั้นต่ำ 15%), อนาคตเป็น 0%, อดีตที่ไม่ได้เล่นเป็น 5% (ฐาน)
                    const barHeight = item.hasData ? Math.max(15, item.retention) : (item.isFuture ? 0 : 5);
                    
                    return (
                        <div key={idx} className="flex flex-col items-center justify-end h-full w-full gap-3 group">
                            {/* กรอบพื้นหลังของแท่งกราฟ */}
                            <div className="w-full max-w-[28px] bg-[#0B1121] rounded-t-lg relative flex items-end overflow-hidden shadow-inner h-full border-t border-white/5">
                                {/* ตัวเนื้อสีของแท่งกราฟ */}
                                <div 
                                    className={`w-full rounded-t-lg transition-all duration-1000 ease-out relative ${item.isToday ? 'bg-gradient-to-t from-amber-600 via-yellow-500 to-amber-300 shadow-[0_0_15px_rgba(250,204,21,0.5)]' : (item.hasData ? 'bg-brand-accent/80' : 'bg-navy-700/50')}`}
                                    style={{ height: `${barHeight}%` }}
                                >
                                    {item.isToday && <div className="absolute inset-0 bg-white/20 rounded-t-lg"></div>}
                                </div>
                            </div>
                            
                            {/* ตัวอักษรบอกวัน (M T W...) */}
                            <span className={`text-[11px] font-bold ${item.isToday ? 'text-brand-yellow' : 'text-slate-500 group-hover:text-slate-300'}`}>
                                {item.dayLabel}
                            </span>
                        </div>
                    );
                })}
            </div>
        </div>
    );
};
